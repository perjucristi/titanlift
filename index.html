  <!-- Fonturi Editoriale Google Fonts: Plus Jakarta Sans & Barlow Condensed (700, 800) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Lucide Icons CDN pentru iconițe vectoriale curate -->

  <!-- Biblioteca canvas-confetti pentru explozia scurtă la record personal (PR) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>

  <style>
    :root {
      --bg-oled: #050507;
      --surface-1: #111114;
      --surface-2: #18181C;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-inner: rgba(255, 255, 255, 0.06);
      --text-primary: #F5F5F7;
      --text-secondary: #8E8E93;
      --accent: #FF4D00;
      --accent-hover: #E64500;
      --success: #22C55E;
    }

    html, body {
      background-color: var(--bg-oled);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .font-display {
      font-family: 'Barlow Condensed', sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .tabular-nums, .font-mono, #live-workout-clock, #live-rest-clock {
      font-variant-numeric: tabular-nums;
    }

    svg.lucide {
      stroke-width: 1.75;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050507; }
    ::-webkit-scrollbar-thumb { background: #24242A; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #FF4D00; }

    input[type="range"] { accent-color: #FF4D00; }

    /* ========================================================================
       DESIGN SYSTEM STEALTH LUXURY OLED — CARDURI, BUTOANE & INPUT-URI PREMIUM
       ======================================================================== */
    .surface-card, .card-clean {
      background-color: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
    }

    .surface-inner {
      background-color: var(--surface-2);
      border: 1px solid var(--border-inner);
    }

    .card-divider {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 10px 18px;
      border-radius: 12px;
      background-color: var(--accent);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease, opacity 150ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.05);
      color: #E4E4E7;
      font-weight: 600;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease, color 150ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
    }
    .btn-secondary:active { transform: scale(0.98); }

    .btn-danger-subtle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 12px;
      background-color: #0B0B0E;
      color: #F87171;
      font-weight: 600;
      font-size: 12px;
      border: 1px solid rgba(239, 68, 68, 0.25);
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-danger-subtle:hover {
      background-color: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.45);
    }
    .btn-danger-subtle:active { transform: scale(0.98); }

    .input-premium {
      width: 100%;
      min-height: 48px;
      padding: 10px 14px;
      border-radius: 12px;
      background-color: #18181C;
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #F5F5F7;
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      outline: none;
      box-shadow: none;
      transition: border-color 150ms ease, background-color 150ms ease;
    }
    .input-premium::placeholder { color: #636366; font-weight: 500; }
    .input-premium:focus { border-color: #FF4D00; outline: none; box-shadow: none; }

    /* Header Minimalist Sticlă Fumurie (Stil iOS Nativ) */
    .ios-glass-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(5, 5, 7, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      padding-top: env(safe-area-inset-top);
    }

    /* Bara de Navigare de Jos (Floating Glass Tab Bar) */
    .ios-glass-tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(11, 11, 14, 0.86);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }

    .ios-tab-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 2px;
      color: var(--text-secondary);
      transition: color 0.22s ease, transform 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .ios-tab-btn:active { transform: scale(0.92); }
    .ios-tab-btn.is-active { color: var(--accent); }
    .ios-tab-btn .tab-indicator {
      position: absolute;
      top: -8px;
      width: 20px;
      height: 2px;
      border-radius: 9999px;
      background-color: var(--accent);
      opacity: 0;
      transform: scaleX(0.4);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .ios-tab-btn.is-active .tab-indicator { opacity: 1; transform: scaleX(1); }

    /* ========================================================================
       STILURI LYFTA PENTRU GRILA DE EXERCIȚII (2 COLOANE) & IMAGINI UNIFORME
       ======================================================================== */
    .exercises-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 540px) {
      .exercises-grid { gap: 12px; }
    }

    .exercise-card, .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      justify-content: space-between;
      background-color: #111114;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .exercise-card:hover, .card:hover {
      border-color: rgba(255, 77, 0, 0.45);
    }

    .exercise-image, .card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background-color: #ffffff;
      border-bottom: 1px solid #333;
      display: block;
    }

    /* ========================================================================
       ETAPA 3 — FINISAJ DE ELITĂ: HERO, HEVY WORKOUT, ELEIKO BARBELL & HEATMAP
       ======================================================================== */
    .hero-radial-card {
      background-color: var(--surface-1);
      background-image: radial-gradient(ellipse 75% 65% at 88% 0%, rgba(255, 77, 0, 0.075) 0%, rgba(255, 77, 0, 0.02) 48%, transparent 72%);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
    }

    .progress-track-4 {
      width: 100%;
      height: 4px;
      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }
    .progress-fill-4 {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #FF4D00 0%, #FF7833 100%);
      transition: width 350ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Rând serie bifată: verde-închis mat discret (stil Hevy / Strong) */
    .set-row-completed {
      background-color: #132219;
      border-color: rgba(34, 197, 94, 0.22);
    }

    /* Pastilă plutitoare pentru cronometrul de pauză */
    .floating-rest-pill {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 45;
      width: calc(100% - 24px);
      max-width: 460px;
      background: rgba(17, 17, 20, 0.94);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 18px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }
    @media (min-width: 1024px) {
      .floating-rest-pill {
        bottom: 24px;
      }
    }

    /* Bară olimpică realistă cu reflexii metalice și discuri Eleiko */
    .barbell-stage {
      background: radial-gradient(ellipse 70% 55% at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 72%), #0B0B0E;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
    }
    .barbell-shaft {
      background: linear-gradient(180deg, #62626B 0%, #B8B8C2 28%, #D9D9E0 48%, #73737C 72%, #3B3B42 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 4px 12px rgba(0, 0, 0, 0.45);
    }
    .barbell-knurl {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.22) 0px,
        rgba(0, 0, 0, 0.22) 1px,
        transparent 1px,
        transparent 3px
      );
    }
    .barbell-collar {
      background: linear-gradient(180deg, #9A9AA6 0%, #F4F4F7 32%, #A1A1AA 62%, #4A4A52 100%);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.55);
    }
    .barbell-sleeve {
      background: linear-gradient(180deg, #71717A 0%, #D4D4D8 30%, #E4E4E7 46%, #71717A 75%, #3F3F46 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), 0 4px 12px rgba(0, 0, 0, 0.45);
    }
    .eleiko-plate {
      position: relative;
      border-radius: 5px;
      box-shadow:
        inset 1px 0 1px rgba(255, 255, 255, 0.28),
        inset -1px 0 2px rgba(0, 0, 0, 0.45),
        0 6px 14px rgba(0, 0, 0, 0.5);
    }
    .eleiko-plate::after {
      content: "";
      position: absolute;
      inset: 3px 2px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, transparent 32%, transparent 72%, rgba(0, 0, 0, 0.22) 100%);
      pointer-events: none;
    }

    /* ========================================================================
       HEATMAP DE CONSISTENȚĂ — COLȚURI FINE 4PX & 3 TREPTE ACCENT (#FF4D00)
       ======================================================================== */
    .consistency-heatmap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 22px);
      gap: 5px;
    }
    .heatmap-cell {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      transition: transform 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      cursor: pointer;
    }
    .heatmap-cell:hover { transform: scale(1.14); }
    .heatmap-cell.level-0 { background-color: #18181C; border: 1px solid rgba(255, 255, 255, 0.04); }
    .heatmap-cell.level-1 { background-color: rgba(255, 77, 0, 0.30); border: 1px solid rgba(255, 77, 0, 0.40); }
    .heatmap-cell.level-2 { background-color: rgba(255, 77, 0, 0.62); border: 1px solid rgba(255, 77, 0, 0.78); }
    .heatmap-cell.level-3 { background-color: #FF4D00; border: 1px solid rgba(255, 165, 120, 0.65); }
    .heatmap-cell.today-cell { outline: 1.5px solid rgba(245, 245, 247, 0.85); outline-offset: 1.5px; }



    /* === SCANNER ANATOMIC DE FORȚĂ (STEALTH OLED) === */
.anatomy-card {
  background: #111114;
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
}

.anatomy-toggle {
  display: inline-flex;
  background: #18181C;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  padding: 3px;
  gap: 3px;
}

.anatomy-toggle-btn {
  padding: 6px 14px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 600;
  color: #8E8E93;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: all 160ms ease;
}

.anatomy-toggle-btn.active {
  background: #FF4D00;
  color: #FFFFFF;
}

.anatomy-stage {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  align-items: center;
  justify-items: center;
  padding: 12px 4px 10px;
}

.anatomy-figure-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 190px;
}

.anatomy-figure-wrap.mobile-hidden {
  display: none;
}

.anatomy-view-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #8E8E93;
  margin-top: 6px;
}

.anatomy-svg {
  width: 100%;
  height: auto;
  max-height: 330px;
  overflow: visible;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.anatomy-silhouette {
  fill: #18181E;
  stroke: rgba(255, 255, 255, 0.12);
  stroke-width: 1;
  stroke-linejoin: round;
}

.anatomy-detail-line {
  fill: none;
  stroke: rgba(255, 255, 255, 0.055);
  stroke-width: 0.9;
  stroke-linecap: round;
  pointer-events: none;
}

.anatomy-muscle-zone {
  cursor: pointer;
  touch-action: manipulation;
  transition: filter 180ms ease, opacity 180ms ease;
}

.anatomy-muscle-zone path {
  stroke: rgba(255, 255, 255, 0.14);
  stroke-width: 0.85;
  stroke-linejoin: round;
  transition: fill 200ms ease, stroke 180ms ease, stroke-width 180ms ease, filter 180ms ease, opacity 180ms ease;
}

/* Glow discret pentru nivelele superioare */
.anatomy-muscle-zone.level-avansat {
  filter: drop-shadow(0 0 6px rgba(255, 77, 0, 0.42));
}

.anatomy-muscle-zone.level-elita {
  filter: drop-shadow(0 0 7px rgba(245, 158, 11, 0.48));
}

/* Hover sincronizat Față + Spate */
.anatomy-muscle-zone.is-hovered {
  filter: brightness(1.24) drop-shadow(0 0 8px rgba(255, 255, 255, 0.22));
}

.anatomy-muscle-zone.is-hovered path {
  stroke: rgba(255, 255, 255, 0.72);
  stroke-width: 1.25;
}

/* Grupa musculară selectată activ */
.anatomy-muscle-zone.is-active {
  filter: brightness(1.16) drop-shadow(0 0 9px rgba(255, 77, 0, 0.55));
}

.anatomy-muscle-zone.is-active path {
  stroke: #FFFFFF;
  stroke-width: 1.65;
}

.anatomy-legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 14px;
  padding-top: 14px;
  margin-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.anatomy-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #8E8E93;
  font-weight: 500;
}

.anatomy-legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  flex-shrink: 0;
}

/* Tooltip flotant Dark Glass */
#anatomy-floating-tooltip {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transform: translate3d(0, 4px, 0);
  transition: opacity 140ms ease, transform 140ms ease;
  background: rgba(17, 17, 20, 0.94);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  padding: 10px 13px;
  min-width: 175px;
  box-shadow: 0 14px 32px rgba(0, 0, 0, 0.6);
}

#anatomy-floating-tooltip.visible {
  opacity: 1;
  transform: translate3d(0, 0, 0);
}

/* Pe desktop (≥ 768px): Față și Spate afișate side-by-side, toggle-ul ascuns */
@media (min-width: 768px) {
  .anatomy-toggle {
    display: none;
  }
  .anatomy-stage {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .anatomy-figure-wrap.mobile-hidden {
    display: flex;
  }
}


/* === UPDATE 1: DARK MODE NATIV, INPUT-URI CURATE, SCROLLBAR & BLUEPRINT EXERCIȚII === */

/* 1. Dark Mode nativ (dropdown-uri, formulare, controale sistem) */
:root,
html {
  color-scheme: dark;
}

/* Eliminare săgeți native (spin buttons) pe toate input-urile numerice */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield;
  appearance: textfield;
}

/* Scrollbar minimalist (6px, negru-antracit) pentru desktop */
* {
  scrollbar-width: thin;
  scrollbar-color: #27272E #050507;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: #050507;
}

::-webkit-scrollbar-thumb {
  background: #27272E;
  border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
  background: #3A3A44;
}

/* 2. Stil «Blueprint Dark Mode» pentru ilustrațiile de exerciții */

/* Containerele albe ale ilustrațiilor (Modal Selectare, Miniaturi Workout, Modal Detalii, Carduri) */
.bg-white:has(> img),
.exercise-card > div:has(> img) {
  background-color: #141418 !important;
  background-image: radial-gradient(
    circle at center,
    rgba(255, 255, 255, 0.03) 0%,
    transparent 72%
  ) !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;
  isolation: isolate;
}

/* Zona superioară a cardului din Bibliotecă atunci când img.exercise-image este copil direct */
.exercise-card:has(> img.exercise-image) {
  background-image:
    linear-gradient(
      to bottom,
      transparent 199px,
      rgba(255, 255, 255, 0.06) 199px,
      rgba(255, 255, 255, 0.06) 200px,
      transparent 200px
    ),
    radial-gradient(
      circle at 50% 100px,
      rgba(255, 255, 255, 0.03) 0%,
      transparent 115px
    ),
    linear-gradient(
      to bottom,
      #141418 0px,
      #141418 200px,
      transparent 200px
    );
  isolation: isolate;
}

/* Transformarea desenelor negru-pe-alb în schițe tehnice argintii pe fundal dark */
img.exercise-image,
.exercise-card img,
.exercises-grid img,
.bg-white:has(> img) > img {
  background-color: transparent !important;
  border-bottom: none !important;
  object-fit: contain;
  filter: contrast(1.2) invert(1) brightness(0.95);
  mix-blend-mode: screen;
}


/* === COMUTATOR FORȚĂ 1RM | RECUPERARE & MOD RECUPERARE (SCANNER ANATOMIC) === */
.anatomy-header {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 10px;
}

.anatomy-header-controls {

  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}

.swap-modal-body {
  padding: 12px 14px 16px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.swap-alt-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px;
  border-radius: 14px;
  background: #18181C;
  border: 1px solid rgba(255, 255, 255, 0.06);
  transition: border-color 160ms ease, background-color 160ms ease;
}

.swap-alt-row:hover {
  border-color: rgba(255, 77, 0, 0.35);
  background: #1D1D22;
}

.swap-alt-thumb {
  width: 44px;
  height: 44px;
  border-radius: 11px;
  background: #141418;
  border: 1px solid rgba(255, 255, 255, 0.06);
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  isolation: isolate;
}

.swap-alt-thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: contrast(1.2) invert(1) brightness(0.95);
  mix-blend-mode: screen;
}

.swap-action-btn {
  padding: 8px 13px;
  border-radius: 11px;
  background: #FF4D00;
  color: #FFFFFF;
  font-size: 12px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  transition: background-color 150ms ease, transform 120ms ease;
}

.swap-action-btn:hover {
  background: #FF621F;
}

.swap-action-btn:active {
  transform: scale(0.96);
}

.swap-in-workout-tag {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.06);
  color: #A1A1AA;
  font-size: 10px;
  font-weight: 600;
}

/* === MODIFICAREA #3: SCANNER ANATOMIC NEON OLED (VIZIBILITATE MAXIMĂ) === */

/* Adâncime discretă în fundalul cardului ca silueta neon să iasă curat în evidență */
.anatomy-card {
  background:
    radial-gradient(ellipse at 50% 44%, rgba(0, 229, 255, 0.045) 0%, transparent 72%),
    #111114;
}

/* 1. Silueta / „Scheletul” corpului — argintiu-cyan clar și vizibil la 20% luminozitate */
.anatomy-svg .anatomy-silhouette {
  fill: #161C29;
  stroke: rgba(186, 230, 253, 0.72);
  stroke-width: 1.6;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 4px rgba(148, 210, 255, 0.35));
}

/* Linii anatomice interne (clavicule, abdomen, coloană) mai clare */
.anatomy-svg .anatomy-detail-line {
  stroke: rgba(186, 230, 253, 0.28);
  stroke-width: 1.05;
}

.anatomy-view-label {
  color: #94A3B8;
}

/* 2. Paleta NEON — Modul Forță 1RM */

/* Neinițiat (0 kg): vizibil și delimitat clar de fundalul negru OLED */
.anatomy-svg .anatomy-muscle-zone.level-neinitiat {
  filter: none;
}

.anatomy-svg .anatomy-muscle-zone.level-neinitiat path {
  fill: #2A3347;
  fill-opacity: 0.94;
  stroke: #64748B;
  stroke-width: 1.15;
}

/* Începător: Verde Neon (#00FF88) */
.anatomy-svg .anatomy-muscle-zone.level-incepator {
  filter: drop-shadow(0 0 6px rgba(0, 255, 136, 0.65));
}

.anatomy-svg .anatomy-muscle-zone.level-incepator path {
  fill: #00FF88;
  fill-opacity: 0.9;
  stroke: #80FFBF;
  stroke-width: 1.05;
}

/* Intermediar: Cyan / Albastru Neon (#00E5FF) */
.anatomy-svg .anatomy-muscle-zone.level-intermediar {
  filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.68));
}

.anatomy-svg .anatomy-muscle-zone.level-intermediar path {
  fill: #00E5FF;
  fill-opacity: 0.92;
  stroke: #8CF3FF;
  stroke-width: 1.05;
}

/* Avansat: Violet / Magenta Neon (#C04BFF) */
.anatomy-svg .anatomy-muscle-zone.level-avansat {
  filter: drop-shadow(0 0 6px rgba(192, 75, 255, 0.72));
}

.anatomy-svg .anatomy-muscle-zone.level-avansat path {
  fill: #C04BFF;
  fill-opacity: 0.92;
  stroke: #E4ADFF;
  stroke-width: 1.05;
}

/* Elită: Portocaliu-Auriu Neon (#FF6B00 cu contur/glow #FFD600) */
.anatomy-svg .anatomy-muscle-zone.level-elita {
  filter: drop-shadow(0 0 6px rgba(255, 214, 0, 0.78));
}

.anatomy-svg .anatomy-muscle-zone.level-elita path {
  fill: #FF6B00;
  fill-opacity: 0.96;
  stroke: #FFD600;
  stroke-width: 1.25;
}

/* 3. Paleta NEON — Modul Recuperare */

/* Sub 50% (Obosit / Odihnă): Roșu-Coral Neon (#FF2E55) */
.anatomy-svg .anatomy-muscle-zone.rec-low {
  filter: drop-shadow(0 0 6px rgba(255, 46, 85, 0.72));
}

.anatomy-svg .anatomy-muscle-zone.rec-low,
.anatomy-svg .anatomy-muscle-zone.rec-low path {
  fill: #FF2E55;
  fill-opacity: 0.92;
  stroke: #FF8FA3;
  stroke-width: 1.05;
}

/* 50–89% (În refacere): Galben-Chihlimbar Neon (#FFD600) */
.anatomy-svg .anatomy-muscle-zone.rec-mid,
.anatomy-svg .anatomy-muscle-zone.rec-high {
  filter: drop-shadow(0 0 6px rgba(255, 214, 0, 0.68));
}

.anatomy-svg .anatomy-muscle-zone.rec-mid,
.anatomy-svg .anatomy-muscle-zone.rec-mid path,
.anatomy-svg .anatomy-muscle-zone.rec-high,
.anatomy-svg .anatomy-muscle-zone.rec-high path {
  fill: #FFD600;
  fill-opacity: 0.9;
  stroke: #FFF099;
  stroke-width: 1.05;
}

/* 90–100% (Gata): Verde Neon (#00FF88) */
.anatomy-svg .anatomy-muscle-zone.rec-ready {
  filter: drop-shadow(0 0 6px rgba(0, 255, 136, 0.65));
}

.anatomy-svg .anatomy-muscle-zone.rec-ready,
.anatomy-svg .anatomy-muscle-zone.rec-ready path {
  fill: #00FF88;
  fill-opacity: 0.9;
  stroke: #80FFBF;
  stroke-width: 1.05;
}

/* 4. Hover & Selecție Activă — păstrează prioritate clară peste culorile neon */
.anatomy-svg .anatomy-muscle-zone.is-hovered {
  filter: brightness(1.2) drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
}

.anatomy-svg .anatomy-muscle-zone.is-hovered path {
  stroke: #FFFFFF;
  stroke-width: 1.65;
}

.anatomy-svg .anatomy-muscle-zone.is-active {
  filter: brightness(1.16) drop-shadow(0 0 9px rgba(255, 255, 255, 0.68));
}

.anatomy-svg .anatomy-muscle-zone.is-active path {
  stroke: #FFFFFF;
  stroke-width: 2.1;
}

/* 5. Legendă mai lizibilă pe OLED la luminozitate scăzută */
.anatomy-legend-item {
  color: #CBD5E1;
  font-weight: 600;
}

.anatomy-legend-dot {
  width: 9px;
  height: 9px;
}


/* === MODIFICAREA #4: TAP MOBIL PE SVG, 5 PASTILE RAPIDE & PANOU FIX DE DETALII === */

/* 1. Tap real și precis pe iOS Safari — silueta nu mai fură atingerile */
.anatomy-svg {
  pointer-events: auto;
  touch-action: manipulation;
}

.anatomy-svg .anatomy-silhouette {
  pointer-events: none;
}

.anatomy-svg .anatomy-muscle-zone,
.anatomy-svg .anatomy-muscle-zone path {
  cursor: pointer;
  pointer-events: all;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* Evidențiere neon mai aprinsă pentru grupa musculară selectată curent */
.anatomy-svg .anatomy-muscle-zone.is-active {
  filter: brightness(1.26) drop-shadow(0 0 11px rgba(255, 255, 255, 0.82)) !important;
}

.anatomy-svg .anatomy-muscle-zone.is-active path {
  stroke: #FFFFFF !important;
  stroke-width: 2.35 !important;
}

/* 2. Rând compact de 5 pastile clicabile sub siluetă (prietenos cu degetul pe iPhone) */
.anatomy-pills-row {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  margin-top: 10px;
}

.anatomy-pill-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 36px;
  padding: 6px 4px;
  border-radius: 11px;
  background: #18181C;
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #CBD5E1;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 120ms ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.anatomy-pill-btn:active {
  transform: scale(0.96);
}

.anatomy-pill-dot {
  width: 7px;
  height: 7px;
  border-radius: 999px;
  flex-shrink: 0;
}

.anatomy-pill-btn.is-active {
  background: rgba(255, 255, 255, 0.08);
  color: #FFFFFF;
  border-color: var(--pill-accent, #FF4D00);
  box-shadow: 0 0 12px color-mix(in srgb, var(--pill-accent, #FF4D00) 36%, transparent);
}

@media (max-width: 390px) {
  .anatomy-pill-btn {
    font-size: 10.5px;
    gap: 3px;
    padding: 6px 2px;
  }
  .anatomy-pill-dot {
    width: 6px;
    height: 6px;
  }
}

/* 3. Panou fix de detalii sub pastile (Stealth OLED + accent neon al grupei) */
.anatomy-detail-panel {
  margin-top: 10px;
  padding: 14px 15px;
  border-radius: 16px;
  background:
    radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--panel-accent, #FF4D00) 11%, transparent) 0%, transparent 62%),
    #15151A;
  border: 1px solid color-mix(in srgb, var(--panel-accent, #FF4D00) 34%, rgba(255, 255, 255, 0.08));
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.anatomy-detail-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.anatomy-detail-name-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.anatomy-detail-name {
  font-size: 15px;
  font-weight: 800;
  color: #F5F5F7;
  letter-spacing: -0.01em;
}

.anatomy-detail-mode-tag {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #94A3B8;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.07);
}

.anatomy-detail-big-value {
  font-family: "Barlow Condensed", sans-serif;
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
  flex-shrink: 0;
}

.anatomy-detail-tier-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid var(--panel-accent, #94A3B8);
  color: var(--panel-accent, #94A3B8);
  background: color-mix(in srgb, var(--panel-accent, #94A3B8) 14%, transparent);
  box-shadow: 0 0 10px color-mix(in srgb, var(--panel-accent, #94A3B8) 26%, transparent);
}

/* Bara vizuală neon de recuperare */
.anatomy-rec-track {
  width: 100%;
  height: 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  overflow: hidden;
}

.anatomy-rec-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 320ms cubic-bezier(0.22, 1, 0.36, 1);
}

.anatomy-detail-meta-grid {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.anatomy-detail-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  color: #A1A1AA;
}

.anatomy-detail-meta-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #94A3B8;
  flex-shrink: 0;
}

.anatomy-detail-meta-val {
  color: #F5F5F7;
  font-weight: 600;
  text-align: right;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

  /* === MODIFICAREA #7: HEATMAP INTERACTIV (CONECTARE LA DETALII ANTRENAMENT) === */

.heatmap-cell-interactive {
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 160ms ease, filter 160ms ease;
}

.heatmap-cell-interactive:active {
  transform: scale(0.88);
}

/* Reacție vizuală dedicată pentru zilele portocalii (cu antrenament) */
.heatmap-cell-active:hover {
  transform: scale(1.18);
  filter: brightness(1.15);
  box-shadow: 0 0 10px rgba(255, 77, 0, 0.55);
  z-index: 2;
  position: relative;
}

/* Reacție discretă pentru zilele gri (odihnă) */
.heatmap-cell-rest:hover {
  filter: brightness(1.25);
}

/* Toast discret Stealth OLED (~2 secunde) pentru zile de odihnă sau cardio */
#titan-consistency-toast {
  position: fixed;
  left: 50%;
  bottom: calc(82px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 14px);
  z-index: 9998;
  pointer-events: none;
  opacity: 0;
  background: rgba(17, 17, 20, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  padding: 9px 16px;
  color: #E4E4E7;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  max-width: calc(100vw - 32px);
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: opacity 180ms ease, transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
}

#titan-consistency-toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

#titan-consistency-toast.is-cardio {
  border-color: rgba(255, 77, 0, 0.38);
}


/* === MODIFICAREA #7 (FIX): PAGINĂ DEDICATĂ DETALII ANTRENAMENT DIN CONSISTENȚĂ === */

.titan-day-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #050507;
  color: #F5F5F7;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: titanDayFadeIn 180ms cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes titanDayFadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.titan-day-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(5, 5, 7, 0.92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}

.titan-day-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 13px;
  border-radius: 12px;
  background: #141418;
  border: 1px solid rgba(255, 255, 255, 0.09);
  color: #F5F5F7;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  transition: background-color 150ms ease, border-color 150ms ease, transform 120ms ease;
}

.titan-day-back-btn:hover {
  background: #1C1C22;
  border-color: rgba(255, 77, 0, 0.45);
}

.titan-day-back-btn:active {
  transform: scale(0.96);
}

.titan-day-header-date {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  color: #FF7A40;
  background: rgba(255, 77, 0, 0.1);
  border: 1px solid rgba(255, 77, 0, 0.25);
  padding: 5px 11px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}

.titan-day-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 18px 16px calc(32px + env(safe-area-inset-bottom, 0px));
}

.titan-day-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.titan-day-session-card {
  background: #111114;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 22px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.titan-day-session-top {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.titan-day-session-title {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  color: #F5F5F7;
  letter-spacing: -0.015em;
  line-height: 1.2;
}

.titan-day-stats-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.titan-day-stat-box {
  background: #18181C;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 13px;
  padding: 10px 11px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.titan-day-stat-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: #8E8E93;
}

.titan-day-stat-val {
  font-family: "Barlow Condensed", sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: #F5F5F7;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}

.titan-day-ex-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.titan-day-ex-card {
  background: #16161B;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 13px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.titan-day-ex-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.titan-day-ex-name {
  font-size: 14.5px;
  font-weight: 700;
  color: #F5F5F7;
  line-height: 1.25;
}

.titan-day-ex-muscle {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #FF4D00;
  margin-bottom: 2px;
}

.titan-day-sets-grid {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.titan-day-set-head,
.titan-day-set-row {
  display: grid;
  grid-template-columns: 44px 1fr 1fr 78px;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 10px;
  font-variant-numeric: tabular-nums;
}

.titan-day-set-head {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #8E8E93;
  padding-top: 2px;
  padding-bottom: 2px;
}

.titan-day-set-row {
  background: #1C1C22;
  border: 1px solid rgba(255, 255, 255, 0.04);
  font-size: 13px;
  font-weight: 600;
  color: #E4E4E7;
}

.titan-day-set-num {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  background: rgba(255, 77, 0, 0.14);
  color: #FF7A40;
  font-size: 11.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}


  /* === MODIFICAREA #8: WORKOUT-URI PROPUSE DIN ISTORIC + AUTO-DENUMIRE INTELIGENTĂ === */

.smart-prop-section {
  background: linear-gradient(145deg, rgba(255, 77, 0, 0.06) 0%, #111114 48%);
  border: 1px solid rgba(255, 77, 0, 0.22);
  border-radius: 20px;
  padding: 16px;
}

@media (min-width: 640px) {
  .smart-prop-section {
    padding: 20px;
  }
}

.smart-prop-summary {
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.smart-prop-summary::-webkit-details-marker {
  display: none;
}

.smart-prop-summary-left {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.smart-prop-icon-wrap {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(255, 77, 0, 0.14);

    function hydrateFromStorage() {
      try {
        const savedStart = safeGetItem(STORAGE_KEYS.START_DATE);
        if (savedStart && /^\d{4}-\d{2}-\d{2}$/.test(savedStart)) {
          state.startDateKey = savedStart;
        } else {
          state.startDateKey = toLocalDateKey(new Date());
          safeSetItem(STORAGE_KEYS.START_DATE, state.startDateKey);
        }

        const p = safeGetItem(STORAGE_KEYS.PROFILE);
        if (p) state.profile = JSON.parse(p);

        const w = safeGetItem(STORAGE_KEYS.WORKOUTS);
        if (w) state.workouts = JSON.parse(w) || [];

        const ex = safeGetItem(STORAGE_KEYS.EXERCISES);
        if (ex) {
          const parsed = JSON.parse(ex) || [];
          const merged = [...INITIAL_EXERCISES];
          parsed.forEach((c) => {
            if (!merged.some((m) => m.id === c.id)) {
              merged.push({ ...c, imageUrl: c.imageUrl || FALLBACK_IMAGE });
            }
          });
          state.exercises = merged;
        }

        const n = safeGetItem(STORAGE_KEYS.NUTRITION);
        if (n) state.nutrition = { ...state.nutrition, ...JSON.parse(n) };

        const c = safeGetItem(STORAGE_KEYS.CARDIO);
        if (c) state.cardioLogs = JSON.parse(c) || [];

        const draft = safeGetItem(STORAGE_KEYS.ACTIVE_WORKOUT);
        if (draft) {
          const d = JSON.parse(draft);
          state.workoutTitle = d.workoutTitle || "Antrenament Forță";
          state.activeExercises = Array.isArray(d.activeExercises) ? d.activeExercises : [];
          state.restTargetSeconds = d.restTargetSeconds || 90;
          state.isRestMuted = Boolean(d.isRestMuted);
        }

        // Restaurare cronometru durată antrenament pe bază de timestamp
        const rawWStart = safeGetItem(STORAGE_KEYS.WORKOUT_START_TIME);
        const rawWPaused = safeGetItem(STORAGE_KEYS.WORKOUT_PAUSED_ELAPSED);
        if (rawWStart && !isNaN(Number(rawWStart))) {
          state.workoutStartTime = Number(rawWStart);
          state.isWorkoutRunning = true;
          state.workoutPausedElapsedMs = 0;
        } else if (rawWPaused && !isNaN(Number(rawWPaused))) {
          state.workoutPausedElapsedMs = Number(rawWPaused);
          state.workoutStartTime = null;
          state.isWorkoutRunning = false;
        }

        // Restaurare timer pauză pe bază de timestamp
        const rawRestEnd = safeGetItem(STORAGE_KEYS.REST_END_TIME);
        const rawRestComp = safeGetItem(STORAGE_KEYS.REST_COMPLETED);
        if (rawRestEnd && !isNaN(Number(rawRestEnd))) {
          state.restEndTime = Number(rawRestEnd);
          state.restCompleted = rawRestComp === "true";
        }
      } catch (err) {
        console.error("Eroare la citirea datelor:", err);

    // ============================================================================
    // 4. MOTOARE DE CALCUL (EPLEY 1RM, TDEE & NEAT, CARDIO, DISCURI & ÎNCĂLZIRE)
    // ============================================================================
    function calculateEpley1RM(weight, reps) {
      const w = parseFloat(weight) || 0;
      const r = parseInt(reps, 10) || 0;
      if (w <= 0 || r <= 0) return 0;
      return r === 1 ? w : w * (1 + r / 30);
    }

    function calculateInverseEpley(target1RM, targetReps) {
      const rm = parseFloat(target1RM) || 0;
      const r = parseInt(targetReps, 10) || 0;
      if (rm <= 0 || r <= 0) return 0;
      return r === 1 ? rm : rm / (1 + r / 30);
    }

    function analyzeMuscleStrength(muscle, repTarget = 8) {
      const p = state.profile || { sex: "Masculin", bodyWeightKg: 80 };
      const sexFactor = p.sex === "Feminin" ? 0.7 : 1.0;
      const bw = Number(p.bodyWeightKg) > 0 ? Number(p.bodyWeightKg) : 80;
      const base = BASE_MALE_MULTIPLIERS[muscle];
      const thresholds = {
        incepator: Math.round(bw * base.incepator * sexFactor * 10) / 10,
        intermediar: Math.round(bw * base.intermediar * sexFactor * 10) / 10,
        avansat: Math.round(bw * base.avansat * sexFactor * 10) / 10,
        elita: Math.round(bw * base.elita * sexFactor * 10) / 10
      };

      let best1RM = 0, bestExerciseName = base.ref, bestSetText = "Niciun set salvat";
      let lastTrained = null;

      state.workouts.forEach((w) => {
        (w.exercises || []).forEach((item) => {
          const ex = state.exercises.find((e) => e.id === item.exerciseId);
          if (!ex || ex.primaryMuscle !== muscle) return;
          (item.sets || []).forEach((s) => {
            if (!s.completed || s.weight <= 0 || s.reps <= 0) return;
            if (!lastTrained || new Date(w.date) > new Date(lastTrained)) lastTrained = w.date;
            const rm = calculateEpley1RM(s.weight, s.reps);
            if (rm > best1RM) {
              best1RM = rm;
              bestExerciseName = ex.name;
              bestSetText = `${s.weight} kg × ${s.reps} rep`;
            }
          });
        });
      });

      const rounded = Math.round(best1RM * 10) / 10;
      let tier = "Neinițiat", tierIndex = 0, nextTier = "Începător", floor = 0, target = thresholds.incepator;
      if (rounded <= 0) {
        tier = "Neinițiat"; tierIndex = 0; nextTier = "Începător"; floor = 0; target = thresholds.incepator;
      } else if (rounded < thresholds.intermediar) {
        tier = "Începător"; tierIndex = 1; nextTier = "Intermediar"; floor = rounded < thresholds.incepator ? 0 : thresholds.incepator; target = thresholds.intermediar;
      } else if (rounded < thresholds.avansat) {
        tier = "Intermediar"; tierIndex = 2; nextTier = "Avansat"; floor = thresholds.intermediar; target = thresholds.avansat;
      } else if (rounded < thresholds.elita) {
        tier = "Avansat"; tierIndex = 3; nextTier = "Elită (Titan)"; floor = thresholds.avansat; target = thresholds.elita;
      } else {
        tier = "Elită (Titan)"; tierIndex = 4; nextTier = null; floor = thresholds.elita; target = thresholds.elita;
      }

      const delta1RM = nextTier ? Math.max(0, Math.round((target - rounded) * 10) / 10) : 0;
      const targetWeightForReps = Math.round(calculateInverseEpley(target, repTarget) * 10) / 10;
      const currentWeightForReps = Math.round(calculateInverseEpley(rounded, repTarget) * 10) / 10;
      const deltaWeightForReps = nextTier ? Math.max(0, Math.round((targetWeightForReps - currentWeightForReps) * 10) / 10) : 0;
      const progressPct = !nextTier ? 100 : rounded > 0 && target > floor ? Math.min(99, Math.max(6, Math.round(((rounded - floor) / (target - floor)) * 100))) : 0;
      const recoveryPercent = lastTrained ? Math.min(100, Math.max(15, Math.round(((Date.now() - new Date(lastTrained).getTime()) / 3600000 / 48) * 100))) : 100;

      return {
        muscle, currentRaw1RM: rounded, bestExerciseName, bestSetText, tier, tierIndex, nextTier,
        nextTierTarget1RM: target, progressPercentInTier: progressPct, delta1RMToNextTier: delta1RM,
        targetWeightForReps, currentWeightForReps, deltaWeightForReps, thresholds, recoveryPercent
      };
    }

    function getOverallStats(analyses) {
      if (state.workouts.length === 0) {
        return { isInitiated: false, level: 0, label: "Nivel Neinițiat", totalWorkouts: 0, totalVolumeKg: 0, totalSets: 0, xpPoints: 0, xpProgressPercent: 0 };
      }
      let vol = 0, sets = 0;
      state.workouts.forEach((w) => (w.exercises || []).forEach((ex) => (ex.sets || []).forEach((s) => {
        if (s.completed && s.weight > 0 && s.reps > 0) { vol += s.weight * s.reps; sets++; }
      })));
      const sumIdx = analyses.reduce((acc, a) => acc + a.tierIndex, 0);
      const xp = Math.round(sumIdx * 350 + sets * 25 + vol * 0.05);
      const level = Math.max(1, Math.floor(xp / 300) + 1);
      const xpProgressPercent = Math.min(100, Math.max(4, Math.round(((xp % 300) / 300) * 100)));
      let label = "Începător";
      if (sumIdx >= 18) label = "Elită (Titan)";
      else if (sumIdx >= 13) label = "Avansat";
      else if (sumIdx >= 8) label = "Intermediar";
      return { isInitiated: true, level, label, totalWorkouts: state.workouts.length, totalVolumeKg: Math.round(vol), totalSets: sets, xpPoints: xp, xpProgressPercent };
    }

    function calculateStepsAndTDEE(override = null) {
      const p = override || state.profile || { bodyWeightKg: 80, heightCm: 180, age: 20, sex: "Masculin" };
      const bw = Math.max(30, Number(p.bodyWeightKg) || 80);
      const h = Math.max(120, Number(p.heightCm) || 180);
      const age = Math.max(12, Number(p.age) || 20);
      const sex = p.sex || "Masculin";
      const dailySteps = Math.max(0, Number(override?.dailySteps ?? state.nutrition.dailyStepsAverage) || 0);
      const monthlySteps = dailySteps * 30;
      const strideM = (h * (sex === "Masculin" ? 0.415 : 0.413)) / 100;
      const dailyDistanceKm = Math.round((dailySteps * strideM / 1000) * 100) / 100;
      const monthlyDistanceKm = Math.round(dailyDistanceKm * 30 * 10) / 10;
      const stepKcalPerDay = Math.round(dailySteps * bw * 0.00055);
      const stepKcalPerMonth = stepKcalPerDay * 30;
      const monthlyFatBurnedKg = Math.round((stepKcalPerMonth / 7700) * 100) / 100;
      const bmr = Math.round(10 * bw + 6.25 * h - 5 * age + (sex === "Masculin" ? 5 : -161));
      const baseNeat = Math.round(bmr * 0.15);
      const totalNeatPerDay = baseNeat + stepKcalPerDay;
      const workoutsWeek = Number(override?.workoutsPerWeek ?? state.nutrition.workoutsPerWeek) || 0;
      const kcalPerSession = Number(state.nutrition.kcalPerWorkoutSession) || 350;
      const gymEatPerDay = Math.round((workoutsWeek * kcalPerSession) / 7);
      const totalEatPerDay = gymEatPerDay + (Number(state.nutrition.extraCardioKcalToday) || 0);
      const sub = bmr + totalNeatPerDay + totalEatPerDay;
      const tef = Math.round(sub * 0.1);
      const maintenanceTdeeKcal = sub + tef;

      const goalsMap = {
        Definire: Math.max(1350, maintenanceTdeeKcal - 400),
        "Recompoziție": Math.max(1450, maintenanceTdeeKcal - 150),
        "Menținere": maintenanceTdeeKcal,
        "Masă Musculară": maintenanceTdeeKcal + 300
      };
      const activeGoalMode = state.nutrition.selectedCalorieGoalMode || p.goal || "Menținere";
      const targetKcal = goalsMap[activeGoalMode] || maintenanceTdeeKcal;
      const proteinGrams = Math.round(bw * 2.0);
      const fatGrams = Math.round(bw * 0.9);
      const carbsGrams = Math.round(Math.max(200, targetKcal - proteinGrams * 4 - fatGrams * 9) / 4);
      const recommendedWaterMl = Math.round(bw * 40 + (stepKcalPerDay > 400 ? 400 : 0));
      const bmi = Math.round((bw / Math.pow(h / 100, 2)) * 10) / 10;

      const bmrPct = Math.round((bmr / maintenanceTdeeKcal) * 100);
      const neatPct = Math.round((totalNeatPerDay / maintenanceTdeeKcal) * 100);
      const eatPct = Math.round((totalEatPerDay / maintenanceTdeeKcal) * 100);
      const tefPct = Math.max(1, 100 - bmrPct - neatPct - eatPct);

      return {
        dailySteps, monthlySteps, strideM: Math.round(strideM * 100) / 100, dailyDistanceKm, monthlyDistanceKm,
        stepKcalPerDay, stepKcalPerMonth, monthlyFatBurnedKg, bmr, totalNeatPerDay, workoutsWeek,
        kcalPerSession, totalEatPerDay, tef, maintenanceTdeeKcal, goalsMap, activeGoalMode, targetKcal,
        proteinGrams, fatGrams, carbsGrams, recommendedWaterMl, bmi, bmrPct, neatPct, eatPct, tefPct
      };
    }

    function calculateRunningMetrics() {
      const dist = Math.max(0.1, parseFloat(state.runDistanceKm) || 5);
      const totalSec = Math.max(10, (parseInt(state.runMinutes, 10) || 0) * 60 + (parseInt(state.runSeconds, 10) || 0));
      const paceSec = totalSec / dist;
      const formattedPace = `${Math.floor(paceSec / 60)}:${String(Math.round(paceSec % 60)).padStart(2, "0")} /km`;
      const speedKmh = Math.round((dist / (totalSec / 3600)) * 10) / 10;
      const bw = state.profile?.bodyWeightKg || 80;
      const caloriesBurned = Math.round(dist * bw * 1.036);
      const estimatedRunSteps = Math.round((dist * 1000) / 1.15);
      const proj = (d2) => {
        const s = totalSec * Math.pow(d2 / dist, 1.06);
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.round(s % 60);
        return h > 0 ? `${h}h ${String(m).padStart(2, "0")}m ${String(sec).padStart(2, "0")}s` : `${m}:${String(sec).padStart(2, "0")}`;
      };
      return { dist, formattedPace, speedKmh, caloriesBurned, estimatedRunSteps, proj5k: proj(5), proj10k: proj(10), projHalf: proj(21.0975) };
    }

    function calculatePlatesPerSide(targetTotalWeight, barWeight = 20) {
      const total = parseFloat(targetTotalWeight) || 0;
      if (total <= barWeight) return { plates: [], remainder: 0, validTotal: barWeight };
      let rem = (total - barWeight) / 2;
      const plates = [];
      AVAILABLE_PLATES.forEach((pl) => {
        while (rem >= pl.weight - 0.001) {
          plates.push(pl);
          rem = Math.round((rem - pl.weight) * 100) / 100;
        }
      });
      const validTotal = Math.round((barWeight + plates.reduce((s, p) => s + p.weight, 0) * 2) * 100) / 100;
      return { plates, remainder: Math.round(rem * 2 * 100) / 100, validTotal };
    }

    function generateWarmupPlan(targetTotal, barWeight) {
      const target = Math.max(barWeight, parseFloat(targetTotal) || barWeight);
      const round25 = (v) => Math.max(barWeight, Math.round(v / 2.5) * 2.5);
      const steps = [
        { id: "w0", label: "Pas 1 — Bara goală", pctLabel: "Bară", weight: barWeight, reps: "10-12 rep", pause: "45s", isMain: false },
        { id: "w50", label: "Pas 2 — Încălzire 50%", pctLabel: "50%", weight: round25(target * 0.5), reps: "6-8 rep", pause: "60s", isMain: false },
        { id: "w70", label: "Pas 3 — Activare 70%", pctLabel: "70%", weight: round25(target * 0.7), reps: "4-5 rep", pause: "90s", isMain: false },
        { id: "w85", label: "Pas 4 — Aclimatizare 85%", pctLabel: "85%", weight: round25(target * 0.85), reps: "2-3 rep", pause: "120s", isMain: false },
        { id: "w100", label: "Seria Principală (100%)", pctLabel: "100%", weight: round25(target), reps: "Set Țintă", pause: "180s", isMain: true }
      ];
      return steps.map((s) => ({ ...s, calc: calculatePlatesPerSide(s.weight, barWeight) }));
    }

    // ============================================================================
    // 5. SUNET AUDIOCONTEXT, CONFETTI SCURT (1-1.3s), TOAST & CRONOMETRE TIMESTAMP
    // ============================================================================
    function playTimerFinishBeep(isPreview = false) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === "suspended") ctx.resume();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        if (isPreview) {
          osc.frequency.setValueAtTime(660, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.14);
        } else {
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.setValueAtTime(880, now + 0.16);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.setValueAtTime(0.02, now + 0.14);
          gain.gain.setValueAtTime(0.25, now + 0.16);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.42);
        }
      } catch (e) {}
    }

    // Calcul timp scurs antrenament din timestamp real Date.now()
    function getLiveWorkoutSeconds() {
      if (state.isWorkoutRunning && state.workoutStartTime) {
        return Math.max(0, Math.floor((Date.now() - state.workoutStartTime) / 1000));
      }
      return Math.max(0, Math.floor((state.workoutPausedElapsedMs || 0) / 1000));
    }

    // Calcul secunde rămase pauză din timestamp real restEndTime
    function getLiveRestRemainingSeconds() {
      if (!state.restEndTime) return 0;
      return Math.max(0, Math.ceil((state.restEndTime - Date.now()) / 1000));
    }

    // Sincronizare instantanee a ambelor cronometre (la fiecare 250ms + visibilitychange / focus / pageshow)
    function syncAllTimersNow() {
      // 1. Actualizare ceas durată antrenament
      const wClock = document.getElementById("live-workout-clock");
      if (wClock) {
        wClock.textContent = formatTime(getLiveWorkoutSeconds());
      }

      // 2. Actualizare ceas pauză între serii & bară de progres din pastila plutitoare
      const rClock = document.getElementById("live-rest-clock");
      const rStatus = document.getElementById("live-rest-status");
      const rBar = document.getElementById("live-rest-progress-bar");
      const rPill = document.getElementById("floating-rest-pill");
      if (state.restEndTime) {
        const rem = getLiveRestRemainingSeconds();
        if (rem <= 0 && !state.restCompleted) {
          state.restCompleted = true;
          state.restEndTime = null;
          safeSetItem(STORAGE_KEYS.REST_COMPLETED, "true");
          safeRemoveItem(STORAGE_KEYS.REST_END_TIME);
          if (!state.isRestMuted) playTimerFinishBeep(false);
          showToast(state.isRestMuted ? "00:00 — Pauza s-a încheiat (Mute)." : "00:00 — Pauza s-a încheiat! Urmează seria următoare.");
          if (rClock) {
            rClock.textContent = "00:00";
            rClock.className = "font-display font-extrabold text-2xl text-[#22C55E] tabular-nums leading-none";
          }
          if (rStatus) rStatus.textContent = "Pauză terminată";
          if (rBar) rBar.style.width = "0%";
          if (rPill) {
            setTimeout(() => {
              if (!state.restEndTime) {
                const el = document.getElementById("floating-rest-pill");
                if (el) el.classList.add("hidden");
              }
            }, 2200);
          }
        } else if (rem > 0) {
          if (rPill) rPill.classList.remove("hidden");
          if (rClock) {
            rClock.textContent = formatTime(rem);
            rClock.className = "font-display font-extrabold text-2xl text-[#F5F5F7] tabular-nums leading-none";
          }
          if (rStatus) rStatus.textContent = `Pauză activă • ${state.restTargetSeconds}s`;
          if (rBar) {
            const pct = state.restTargetSeconds > 0 ? Math.min(100, Math.max(0, (rem / state.restTargetSeconds) * 100)) : 0;
            rBar.style.width = `${pct}%`;
          }
        }
      } else if (rClock) {
        rClock.textContent = "00:00";
        if (rBar) rBar.style.width = "0%";
      }
    }

    function startMasterTimerLoop() {
      if (masterTimerInterval) clearInterval(masterTimerInterval);
      masterTimerInterval = setInterval(syncAllTimersNow, 250);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") syncAllTimersNow();
    });
    window.addEventListener("focus", syncAllTimersNow);
    window.addEventListener("pageshow", syncAllTimersNow);

    // Recorduri 1RM în localStorage
    function getSavedMax1RM(exerciseId) {
      let max1RM = 0;
      try {
        const raw = safeGetItem(STORAGE_KEYS.EXERCISE_PRS);
        if (raw) {
          const obj = JSON.parse(raw);
          if (obj && typeof obj[exerciseId] === "number") max1RM = Math.max(max1RM, obj[exerciseId]);
        }
      } catch (e) {}
      state.workouts.forEach((w) => (w.exercises || []).forEach((it) => {
        if (it.exerciseId === exerciseId) {
          (it.sets || []).forEach((s) => {
            if (s.completed && s.weight > 0 && s.reps > 0) {
              const rm = calculateEpley1RM(s.weight, s.reps);
              if (rm > max1RM) max1RM = rm;
            }
          });
        }
      }));
      return Math.round(max1RM * 10) / 10;
    }

    function saveNewMax1RM(exerciseId, new1RM) {
      try {
        const raw = safeGetItem(STORAGE_KEYS.EXERCISE_PRS);
        const obj = raw ? JSON.parse(raw) : {};
        obj[exerciseId] = Math.round(new1RM * 10) / 10;
        safeSetItem(STORAGE_KEYS.EXERCISE_PRS, JSON.stringify(obj));
      } catch (e) {}

    function buildHeatmapHTML() {
      const activityMap = {};

        const k = toLocalDateKey(w.date);
        if (!k) return;
        if (!activityMap[k]) activityMap[k] = { count: 0, details: [] };
        activityMap[k].count += 1;
        activityMap[k].details.push(`Forță: ${w.title || "Antrenament"}`);
      });
      state.cardioLogs.forEach((c) => {
        const k = toLocalDateKey(c.date);
        if (!k) return;
        if (!activityMap[k]) activityMap[k] = { count: 0, details: [] };
        activityMap[k].count += 1;
        activityMap[k].details.push(`Cardio: ${c.type || "Alergare"} (${c.distanceKm || 0} km)`);
      });

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayKey = toLocalDateKey(today);
      const startObj = parseLocalDateKey(state.startDateKey);
      const safeStart = startObj > today ? new Date(today) : startObj;

      // Maxim fereastră mobilă de 90 de zile de la dataDeInceput până astăzi
      const diffDays = Math.floor((today.getTime() - safeStart.getTime()) / 86400000) + 1;
      const totalDaysToShow = Math.max(1, Math.min(90, diffDays));
      const windowStart = new Date(today);
      windowStart.setDate(today.getDate() - (totalDaysToShow - 1));

      let activeDays = 0;
      let totalSessions = 0;
      const cells = [];

      for (let i = 0; i < totalDaysToShow; i++) {
        const cur = new Date(windowStart);
        cur.setDate(windowStart.getDate() + i);
        const key = toLocalDateKey(cur);
        const rec = activityMap[key] || { count: 0, details: [] };
        if (rec.count > 0) { activeDays++; totalSessions += rec.count; }
        const level = Math.min(3, rec.count);
        const isToday = key === todayKey;
        const isSel = state.selectedHeatmapDay && state.selectedHeatmapDay.dateKey === key;
        const labelDate = cur.toLocaleDateString("ro-RO", { day: "numeric", month: "short", year: "numeric" });
        cells.push(`
      <button type="button" onclick="openConsistencyDayDetail('${key}')"
        title="${escapeHtml(labelDate)}: ${rec.count === 0 ? "Zi de pauză" : rec.count + " sesiuni"}"

      </button>
    `);
      }

      const pct = Math.round((activeDays / totalDaysToShow) * 100);
      const selInfo = state.selectedHeatmapDay
        ? (() => {
            const rec = activityMap[state.selectedHeatmapDay.dateKey] || { count: 0, details: [] };

                <div>
                  <span class="text-xs font-semibold text-[#8E8E93] block">Zi selectată: <strong class="text-[#F5F5F7]">${escapeHtml(state.selectedHeatmapDay.label)}</strong></span>
                  ${rec.count === 0
                    ? `<p class="text-xs text-[#8E8E93] mt-1">Nicio sesiune înregistrată în această zi (refacere).</p>`
                    : `<div class="flex flex-wrap gap-1.5 mt-2">${rec.details.map((d) => `<span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-[#FF4D00]/15 text-[#FF4D00] border border-[#FF4D00]/30">${escapeHtml(d)}</span>`).join("")}</div>`}
                </div>
                <button type="button" onclick="clearHeatmapDay()" class="btn-secondary min-h-[34px] py-1.5 px-3 text-xs">Închide</button>
              </div>`;
          })()
        : "";

      return `

          <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
              <span class="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-widest text-[#8E8E93]">

                          ? "bg-[#FF4D00]/15 border-[#FF4D00] text-[#FF4D00]"

                      <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                        ${s.calc.plates.length === 0
                          ? `<span class="text-[11px] text-[#8E8E93]">Bară goală (${state.selectedBarWeight} kg)</span>`
                          : s.calc.plates.map((p) => `<span style="background:${p.color};border-color:${p.border};color:${p.darkText ? "#111114" : "#F5F5F7"};" class="px-1.5 py-0.5 rounded border text-[10px] font-bold tabular-nums">${p.weight}</span>`).join("")}
                      </div>
                    </div>

                    <div class="flex items-center gap-2.5 ml-auto">
                      <span class="font-display text-2xl font-extrabold text-[#F5F5F7] tabular-nums">${s.weight} <span class="text-xs font-sans font-semibold text-[#8E8E93]">kg</span></span>

                    </div>
                  </div>
                </div>`;
            }).join("")}
          </div>
        </div>
      `;

    // ============================================================================
    // 8. RANDAREA PRINCIPALĂ A APLICAȚIEI (7 TAB-URI)

    function renderApp() {

      if (!state.profile) {
        appEl.innerHTML = buildOnboardingHTML();
        refreshLucideIcons();
        return;
      }

      const analyses = MUSCLE_GROUPS.map((m) => analyzeMuscleStrength(m, state.selectedPredictiveReps));
      const overall = getOverallStats(analyses);
      const tdee = calculateStepsAndTDEE();
      const selAnalysis = analyses.find((a) => a.muscle === state.selectedPredictiveMuscle) || analyses[0];

      const navItems = [
        { id: "dashboard", label: "Acasă", desktopLabel: "Dashboard", icon: "activity" },
        { id: "nutrition", label: "Pași", desktopLabel: "Pași & Menținere", icon: "flame" },
        { id: "tracker", label: "Workout", desktopLabel: "Workout", icon: "dumbbell" },
        { id: "cardio", label: "Cardio", desktopLabel: "Cardio", icon: "heart-pulse" },
        { id: "plates", label: "Discuri", desktopLabel: "Discuri", icon: "disc" },
        { id: "exercises", label: "Exerciții", desktopLabel: `Exerciții (${state.exercises.length})`, icon: "book-open" },
        { id: "studio", label: "Profil", desktopLabel: "Profil", icon: "user" }

          return { title: w.title, short: `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`, vol: Math.round(vol) };

                  <button type="button" onclick="setActiveTab('nutrition')" class="btn-secondary min-h-[42px]">
                    <i data-lucide="flame" class="w-4 h-4 text-[#FF4D00]"></i>
                    Menținere
                  </button>
                  <button type="button" onclick="startNewWorkout()" class="btn-primary min-h-[42px]">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    ${state.activeExercises.length > 0 ? "Continuă" : "Start"}
                  </button>
                </div>
              </div>

              <!-- 3 Metrici Principale în Barlow Condensed -->
              <div class="grid grid-cols-3 gap-3 sm:gap-6 tabular-nums">
                <div>
                  <span class="text-[10px] sm:text-[11px] uppercase tracking-wider text-[#8E8E93] block">Menținere</span>

                          <span class="tabular-nums">Recuperare ${a.recoveryPercent}%</span>

      else if (state.activeTab === "nutrition") {

                </div>
                <div class="min-w-0">
                  <span class="font-display text-xl font-extrabold tracking-[0.14em] text-[#F5F5F7] block leading-none">TITANLIFT</span>
                  <span class="text-[11px] text-[#8E8E93] block truncate mt-0.5">

                      class="px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer ${

            <div class="max-w-lg mx-auto px-1 grid grid-cols-7">
              ${navItems.map((n) => {

    // ============================================================================
    // 9. RANDAREA FERESTRELOR MODALE (INCLUSIV PICKER OPTIMIZAT PENTRU IPHONE / SAFARI)

        root.innerHTML = "";
        return;

      // 1. MODAL SELECTEAZĂ UN EXERCIȚIU (Optimizat pentru iPhone / Safari: fără turtire carduri, imagini întregi object-contain, nume complet vizibil)
      if (state.activeModal === "picker") {
        const pickerFiltered = state.exercises.filter(
          (e) => state.pickerMuscleFilter === "Toate" || e.primaryMuscle === state.pickerMuscleFilter

        root.innerHTML = `
          <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4" onclick="if(event.target===this) closeModal()">
            <div class="bg-[#111114] border border-white/[0.08] rounded-3xl w-full max-w-2xl max-h-[85dvh] flex flex-col overflow-hidden shadow-2xl">
              <!-- Antet fix (shrink-0) -->
              <div class="shrink-0 p-4 sm:p-5 border-b border-white/[0.07] flex items-center justify-between gap-2">
                <div>
                  <h3 class="text-base sm:text-lg font-extrabold text-[#F5F5F7]">Selectează un Exercițiu</h3>

                </div>
                <button type="button" onclick="closeModal()" class="btn-secondary min-h-[36px] py-1.5 px-3 text-xs">

                </button>

              <!-- Filtre grupe musculare fixe (shrink-0) -->
              <div class="shrink-0 px-4 py-3 border-b border-white/[0.07] flex flex-wrap gap-1.5">
                ${["Toate", ...MUSCLE_GROUPS].map((g) => {
                  const count = g === "Toate" ? state.exercises.length : state.exercises.filter((e) => e.primaryMuscle === g).length;
                  const active = state.pickerMuscleFilter === g;
                  return `
                    <button type="button" onclick="setPickerFilter('${g}')"
                      class="px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${
                        active ? "bg-[#FF4D00] text-white" : "bg-[#18181C] text-[#8E8E93] border border-white/[0.06] hover:text-white"

              <!-- Zona de scroll dedicată (flex-1 min-h-0 overflow-y-auto) -->
              <div class="flex-1 min-h-0 overflow-y-auto overscroll-contain p-3 sm:p-4" style="-webkit-overflow-scrolling: touch;">
                <div class="grid grid-cols-2 gap-3 content-start auto-rows-max">
                  ${pickerFiltered.map((ex) => {
                    const imgSource = ex.imageUrl ? ex.imageUrl : FALLBACK_IMAGE;
                    return `
                      <button type="button" onclick="addExerciseToWorkout('${ex.id}', false)"
                        class="h-auto w-full text-left flex flex-col rounded-xl border border-white/[0.08] hover:border-[#FF4D00] bg-[#121722] transition active:scale-[0.98] cursor-pointer touch-manipulation">
                        <div class="h-28 w-full bg-white p-2 flex items-center justify-center rounded-t-xl shrink-0">
                          <img src="${escapeHtml(imgSource)}" alt="${escapeHtml(ex.name)}" class="w-full h-full object-contain" loading="lazy"
                            onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}';" />
                        </div>
                        <div class="p-2.5 bg-[#121722] flex flex-col gap-1 rounded-b-xl">
                          <span class="self-start text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-[#FF4D00]/15 text-[#FF4D00]">
                            ${escapeHtml(ex.primaryMuscle)}
                          </span>
                          <span class="text-xs font-bold text-white leading-snug break-words">
                            ${escapeHtml(ex.name)}
                          </span>
                        </div>
                      </button>`;
                  }).join("")}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 2. MODAL DETALII EXERCIȚIU
      else if (state.activeModal === "exerciseDetail") {
        const ex = state.exercises.find((e) => e.id === state.selectedExerciseDetailId);
        if (!ex) { closeModal(); return; }
        root.innerHTML = `
          <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
            <div class="bg-[#111114] border border-white/[0.08] rounded-3xl overflow-hidden max-w-md w-full shadow-2xl">
              <div class="relative bg-white">
                <img src="${escapeHtml(ex.imageUrl || FALLBACK_IMAGE)}" alt="${escapeHtml(ex.name)}" class="exercise-image"
                  onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}';" />
                <button type="button" onclick="closeModal()" class="absolute top-3 right-3 p-2 rounded-xl bg-[#050507]/85 text-white cursor-pointer">
