                </button>
              </div>
              <div class="p-5 space-y-4">
                <div>
                  <span class="text-[11px] font-bold uppercase text-[#FF4D00]">${escapeHtml(ex.primaryMuscle)} • ${escapeHtml(ex.subGroup || "")}</span>
                  <h3 class="text-lg font-bold text-[#F5F5F7] mt-0.5">${escapeHtml(ex.name)}</h3>
                </div>
                <p class="text-xs text-[#8E8E93] leading-relaxed">${escapeHtml(ex.description || "")}</p>
                ${(ex.tips || []).length > 0 ? `
                  <div class="card-divider pt-3 space-y-1.5">
                    <span class="text-xs font-bold text-[#F5F5F7] block">Recomandări de execuție</span>
                    <ul class="space-y-1 text-xs text-[#8E8E93]">
                      ${ex.tips.map((t) => `<li>• ${escapeHtml(t)}</li>`).join("")}
                    </ul>
                  </div>` : ""}
                  ${renderExerciseSubMuscleBadgeHTML(ex)}
                  ${renderExerciseBestSetModalHTML(ex.id || ex.name)}
                  ${renderExerciseDetailAlternativesHTML(ex)}
                <button type="button" onclick="addExerciseToWorkout('${ex.id}', true)" class="btn-primary w-full">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  Adaugă în Workout Tracker
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // 3. MODAL ADĂUGARE EXERCIȚIU PERSONALIZAT
      else if (state.activeModal === "addCustom") {
        root.innerHTML = `
          <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
            <form onsubmit="submitCustomExercise(event)" class="bg-[#111114] border border-white/[0.08] rounded-3xl p-6 w-full max-w-md space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-[#F5F5F7]">Adaugă Exercițiu Nou</h3>
                <button type="button" onclick="closeModal()" class="p-1.5 text-[#8E8E93] hover:text-white cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
              </div>
              <div>
                <label class="block text-[11px] font-semibold uppercase text-[#8E8E93] mb-1">Nume Exercițiu</label>
                <input id="custom-ex-name" type="text" placeholder="Ex: Împins la aparatul Hammer" class="input-premium" required />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-[11px] font-semibold uppercase text-[#8E8E93] mb-1">Grupă</label>
                  <select id="custom-ex-muscle" class="input-premium">
                    ${MUSCLE_GROUPS.map((m) => `<option value="${m}">${m}</option>`).join("")}
                  </select>
                </div>
                <div>
                  <label class="block text-[11px] font-semibold uppercase text-[#8E8E93] mb-1">Echipament</label>
                  <input id="custom-ex-eq" type="text" value="Aparat / Gantere" class="input-premium" />
                </div>
              </div>
              <div>
                <label class="block text-[11px] font-semibold uppercase text-[#8E8E93] mb-1">Link Imagine (opțional)</label>
                <input id="custom-ex-img" type="url" placeholder="https://..." class="input-premium" />
              </div>
              <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="btn-secondary flex-1">Anulează</button>
                <button type="submit" class="btn-primary flex-1">Salvează</button>
              </div>
            </form>
          </div>
        `;
      }

      // 4. MODAL CONFIRMARE RESETARE LA ZERO (Fără window.confirm blocant)
      else if (state.activeModal === "confirmReset") {
        root.innerHTML = `
          <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
            <div class="bg-[#111114] border border-red-500/35 rounded-3xl p-6 max-w-md w-full space-y-5 shadow-2xl">
              <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-xl bg-red-500/15 text-red-400 flex items-center justify-center shrink-0">
                  <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                </div>
                <div>
                  <h3 class="text-base font-bold text-[#F5F5F7]">Confirmare Resetare</h3>
                  <p class="text-xs text-[#8E8E93] mt-1 leading-relaxed">
                    Ești absolut sigur că vrei să ștergi tot istoricul? Această acțiune este ireversibilă.
                  </p>
                </div>
              </div>
              <div class="flex gap-2.5">
                <button type="button" onclick="closeModal()" class="btn-secondary flex-1">Anulează</button>
                <button type="button" onclick="executeResetToZero()" class="btn-danger-subtle flex-1 bg-red-500/20 border-red-500/50 text-red-300 font-bold">
                  OK — Șterge Tot
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // 5. MODAL KIT PWA (Setări Avansate)
      else if (state.activeModal === "pwaKit") {
        root.innerHTML = `
          <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
            <div class="bg-[#111114] border border-white/[0.08] rounded-3xl p-6 max-w-lg w-full space-y-5 shadow-2xl">
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-[#F5F5F7] flex items-center gap-2">
                  <i data-lucide="smartphone" class="w-5 h-5 text-[#FF4D00]"></i>
                  Kit Instalare Telefon (PWA)
                </h3>
                <button type="button" onclick="closeModal()" class="btn-secondary min-h-[34px] py-1 px-2.5">Închide</button>
              </div>
              <p class="text-xs text-[#8E8E93] leading-relaxed">
                Descarcă fișierele de mai jos și pune-le în același folder cu <code>index.html</code> (iconițele în <code>/icons/</code>) pentru a instala TitanLift direct pe ecranul principal al telefonului.
              </p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <button type="button" onclick="downloadPwaFile('manifest')" class="btn-primary">
                  <i data-lucide="download" class="w-4 h-4"></i> manifest.json
                </button>
                <button type="button" onclick="downloadPwaFile('sw')" class="btn-secondary">
                  <i data-lucide="download" class="w-4 h-4"></i> service-worker.js
                </button>
                <button type="button" onclick="downloadGeneratedPwaIcon(192)" class="btn-secondary">
                  <i data-lucide="image" class="w-4 h-4"></i> Icon 192×192
                </button>
                <button type="button" onclick="downloadGeneratedPwaIcon(512)" class="btn-secondary">
                  <i data-lucide="image" class="w-4 h-4"></i> Icon 512×512
                </button>
              </div>
            </div>
          </div>
        `;
      }

      refreshLucideIcons();
    }

    // ============================================================================
    // 10. HANDLERE DE ACȚIUNI EXPUSE GLOBAL (WINDOW)
    // ============================================================================
    window.setActiveTab = function (tabId) {
      state.activeTab = tabId;
      renderApp();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.openModal = function (name) {
      state.activeModal = name;
      renderModal();
    };

    window.closeModal = function () {
      state.activeModal = null;
      renderModal();
    };

    window.submitOnboarding = function (event) {
      event.preventDefault();
      const name = (document.getElementById("ob-name")?.value || "").trim();
      const sex = document.getElementById("ob-sex")?.value || "Masculin";
      const weight = parseFloat(document.getElementById("ob-weight")?.value) || 80;
      const height = parseInt(document.getElementById("ob-height")?.value, 10) || 180;
      const age = parseInt(document.getElementById("ob-age")?.value, 10) || 20;
      const steps = parseInt(document.getElementById("ob-steps")?.value, 10) || 10000;
      const wWeek = parseInt(document.getElementById("ob-workouts-week")?.value, 10) || 4;
      if (!name) return;
      state.profile = { name, sex, bodyWeightKg: Math.round(weight * 10) / 10, heightCm: height, age, goal: "Menținere", createdAt: new Date().toISOString() };
      state.nutrition.dailyStepsAverage = Math.max(0, steps);
      state.nutrition.workoutsPerWeek = Math.max(0, Math.min(14, wWeek));
      state.startDateKey = toLocalDateKey(new Date());
      persistAllState();
      showToast("Profil salvat! Bine ai venit în TitanLift.");
      renderApp();
    };

    window.updateBiometricProfile = function (event) {
      event.preventDefault();
      const name = (document.getElementById("profile-name")?.value || "").trim();
      const sex = document.getElementById("profile-sex")?.value || "Masculin";
      const weight = parseFloat(document.getElementById("profile-weight")?.value);
      const height = parseInt(document.getElementById("profile-height")?.value, 10);
      const age = parseInt(document.getElementById("profile-age")?.value, 10);
      const steps = parseInt(document.getElementById("profile-steps")?.value, 10);
      if (!name || isNaN(weight) || isNaN(height) || isNaN(age)) {
        showToast("Te rog completează corect toate câmpurile profilului.");
        return;
      }
      state.profile = { ...state.profile, name, sex, bodyWeightKg: Math.round(weight * 10) / 10, heightCm: height, age };
      if (!isNaN(steps)) state.nutrition.dailyStepsAverage = Math.max(0, steps);
      persistAllState();
      showToast(`Profil actualizat: ${name}, ${state.profile.bodyWeightKg} kg, ${height} cm, ${age} ani.`);
      renderApp();
    };

    window.loadDemoData = function () {
      if (!state.profile) {
        state.profile = { name: "Cristian", sex: "Masculin", bodyWeightKg: 82, heightCm: 175, age: 20, goal: "Menținere", createdAt: new Date().toISOString() };
      }
      const now = Date.now(), day = 86400000;
      const startD = new Date(now - 10 * day);
      state.startDateKey = toLocalDateKey(startD);
      state.workouts = [
        { id: "demo-1", title: "Push Day — Piept & Umeri", date: new Date(now - 6 * day).toISOString(), durationSeconds: 3180, exercises: [{ id: "de1", exerciseId: "chest-barbell-bench", sets: [{ id: "ds1", setNumber: 1, setType: "N", weight: 80, reps: 8, rpe: 8, completed: true }] }, { id: "de2", exerciseId: "shoulders-ohp", sets: [{ id: "ds2", setNumber: 1, setType: "N", weight: 50, reps: 6, rpe: 8.5, completed: true }] }] },
        { id: "demo-2", title: "Pull Day — Spate & Biceps", date: new Date(now - 3 * day).toISOString(), durationSeconds: 3400, exercises: [{ id: "de3", exerciseId: "back-barbell-row", sets: [{ id: "ds3", setNumber: 1, setType: "N", weight: 82.5, reps: 8, rpe: 8.5, completed: true }] }, { id: "de4", exerciseId: "arms-ez-curl", sets: [{ id: "ds4", setNumber: 1, setType: "N", weight: 37.5, reps: 8, rpe: 8.5, completed: true }] }] },
        { id: "demo-3", title: "Leg Day — Forță", date: new Date(now - 1 * day).toISOString(), durationSeconds: 3600, exercises: [{ id: "de5", exerciseId: "legs-barbell-squat", sets: [{ id: "ds5", setNumber: 1, setType: "N", weight: 105, reps: 6, rpe: 8.5, completed: true }] }] }
      ];
      persistAllState();
      showToast("Date demo încărcate cu succes.");
      state.activeTab = "dashboard";
      renderApp();
    };

    window.requestResetToZero = function () {
      openModal("confirmReset");
    };

    window.executeResetToZero = function () {
      Object.values(STORAGE_KEYS).forEach((k) => safeRemoveItem(k));
      state.profile = null;
      state.workouts = [];
      state.cardioLogs = [];
      state.exercises = [...INITIAL_EXERCISES];
      state.activeExercises = [];
      state.workoutStartTime = null;
      state.workoutPausedElapsedMs = 0;
      state.isWorkoutRunning = false;
      state.restEndTime = null;
      state.restCompleted = true;
      state.startDateKey = toLocalDateKey(new Date());
      state.selectedHeatmapDay = null;
      state.activeModal = null;
      showToast("Toate datele au fost șterse și aplicația a fost resetată.");
      renderApp();
    };

    // Dashboard & Heatmap
    window.selectPredictiveMuscle = function (m) { state.selectedPredictiveMuscle = m; renderApp(); };
    window.setPredictiveReps = function (r) { state.selectedPredictiveReps = Math.max(1, Math.min(15, parseInt(r, 10) || 8)); renderApp(); };
    window.selectHeatmapDay = function (dateKey) {
      const d = parseLocalDateKey(dateKey);
      state.selectedHeatmapDay = { dateKey, label: d.toLocaleDateString("ro-RO", { weekday: "short", day: "numeric", month: "long", year: "numeric" }) };
      renderApp();
    };
    window.clearHeatmapDay = function () { state.selectedHeatmapDay = null; renderApp(); };

    // Nutrition & Steps
    window.updateDailySteps = function (val) {
      state.nutrition.dailyStepsAverage = Math.max(0, Math.min(60000, Math.round(Number(val) || 0)));
      persistAllState(); renderApp();
    };
    window.updateMonthlySteps = function (val) {
      const m = Math.max(0, Math.min(1800000, Math.round(Number(val) || 0)));
      state.nutrition.dailyStepsAverage = Math.round(m / 30);
      persistAllState(); renderApp();
    };
    window.updateNutritionField = function (field, val) {
      state.nutrition[field] = Number(val) || 0;
      persistAllState(); renderApp();
    };
    window.selectCalorieGoal = function (mode) {
      state.nutrition.selectedCalorieGoalMode = mode;
      persistAllState(); renderApp();
    };
    window.addQuickMeal = function () {
      const k = parseInt(document.getElementById("quick-meal-kcal")?.value, 10) || 0;
      const p = parseInt(document.getElementById("quick-meal-protein")?.value, 10) || 0;
      if (k <= 0 && p <= 0) return;
      state.nutrition.consumedKcalToday += k;
      state.nutrition.consumedProteinToday += p;
      persistAllState(); showToast("Masă adăugată în jurnal."); renderApp();
    };
    window.resetTodayNutrition = function () {
      state.nutrition.consumedKcalToday = 0;
      state.nutrition.consumedProteinToday = 0;
      state.nutrition.extraCardioKcalToday = 0;
      persistAllState(); renderApp();
    };
    window.addWater = function (ml) { state.nutrition.waterMlToday += ml; persistAllState(); renderApp(); };
    window.toggleCreatine = function () {
      state.nutrition.creatineTakenToday = !state.nutrition.creatineTakenToday;
      state.nutrition.creatineStreakDays = Math.max(0, state.nutrition.creatineStreakDays + (state.nutrition.creatineTakenToday ? 1 : -1));
      persistAllState(); renderApp();
    };

    // Workout Tracker & Timestamp Timers
    function ensureWorkoutTimerStarted() {
      if (!state.isWorkoutRunning && !state.workoutStartTime) {
        state.workoutStartTime = Date.now() - (state.workoutPausedElapsedMs || 0);
        state.isWorkoutRunning = true;
        state.workoutPausedElapsedMs = 0;
        safeSetItem(STORAGE_KEYS.WORKOUT_START_TIME, String(state.workoutStartTime));
        safeRemoveItem(STORAGE_KEYS.WORKOUT_PAUSED_ELAPSED);
      }
    }

    window.startNewWorkout = function () {
      state.activeTab = "tracker";
      if (!state.isWorkoutRunning && state.activeExercises.length === 0) {
        state.workoutTitle = `Antrenament #${state.workouts.length + 1} (${new Date().toLocaleDateString("ro-RO")})`;
        state.workoutPausedElapsedMs = 0;
        ensureWorkoutTimerStarted();
      }
      persistAllState();
      renderApp();
    };

    window.toggleWorkoutTimer = function () {
      if (state.isWorkoutRunning && state.workoutStartTime) {
        state.workoutPausedElapsedMs = Math.max(0, Date.now() - state.workoutStartTime);
        state.workoutStartTime = null;
        state.isWorkoutRunning = false;
        safeSetItem(STORAGE_KEYS.WORKOUT_PAUSED_ELAPSED, String(state.workoutPausedElapsedMs));
        safeRemoveItem(STORAGE_KEYS.WORKOUT_START_TIME);
      } else {
        state.workoutStartTime = Date.now() - (state.workoutPausedElapsedMs || 0);
        state.isWorkoutRunning = true;
        state.workoutPausedElapsedMs = 0;
        safeSetItem(STORAGE_KEYS.WORKOUT_START_TIME, String(state.workoutStartTime));

function getAnatomyMuscleDataMap() {
  const defaults = {
    "Piept": { level: "Neinițiat", oneRM: 0, recovery: 100 },
    "Spate": { level: "Neinițiat", oneRM: 0, recovery: 100 },
    "Picioare": { level: "Neinițiat", oneRM: 0, recovery: 100 },
    "Umeri": { level: "Neinițiat", oneRM: 0, recovery: 100 },
    "Brațe": { level: "Neinițiat", oneRM: 0, recovery: 100 }
  };

  if (typeof analyzeMuscleStrength !== "function") return defaults;

  const raw = ["Piept", "Spate", "Picioare", "Umeri", "Brațe"].map((m) => analyzeMuscleStrength(m));
  const entries = Array.isArray(raw)
    ? raw
    : (raw && typeof raw === "object"
        ? Object.entries(raw).map(([k, v]) => ({ group: k, ...(v || {}) }))
        : []);

  const norm = (s) =>
    String(s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

  Object.keys(defaults).forEach((targetName) => {
    const tNorm = norm(targetName);
    const match = entries.find((item) => {
      const candidate = norm(item.group || item.muscle || item.name || item.label || item.id);
      return candidate === tNorm || candidate.includes(tNorm);
    });

    if (match) {
      const rmKey = Object.keys(match).find(
        (k) => /1rm/i.test(k) && !/target|next|need|diff|delta|missing/i.test(k) && match[k] != null && match[k] !== "" && Number.isFinite(Number(match[k]))
      );
      const rm = Number(
        match.best1RM ?? match.max1RM ?? match.oneRM ?? match.e1RM ?? match.e1rm ?? match.est1RM ?? match.estimated1RM ?? match.current1RM ?? match.rm ?? (rmKey ? match[rmKey] : 0) ?? 0
      ) || 0;

      const recKey = Object.keys(match).find(
        (k) => /recov/i.test(k) && match[k] != null && match[k] !== "" && Number.isFinite(Number(match[k]))
      );
      const rec = match.recovery ?? match.recoveryPct ?? match.recoveryPercent ?? match.readiness ?? (recKey ? match[recKey] : 100);

      const TIER_NAMES = ["Neinițiat", "Începător", "Intermediar", "Avansat", "Elită"];
      const lvl =
        typeof match.tierIndex === "number" && TIER_NAMES[match.tierIndex]
          ? TIER_NAMES[match.tierIndex]
          : (match.tier || match.level || match.rank || (rm <= 0 ? "Neinițiat" : "Începător"));

      defaults[targetName] = {
        level: lvl,
        oneRM: Math.round(rm * 10) / 10,
        recovery: Math.max(0, Math.min(100, Math.round(Number(rec) || 0)))
      };
    }
  });

  return defaults;
}

function getAnatomyLevelStyle(levelName, oneRM) {
  const n = String(levelName || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");

  if (!oneRM || oneRM <= 0 || n.includes("neinitiat") || n.includes("fara")) {
    return {
      fill: "#2A3347",
      opacity: "0.94",
      cls: "level-neinitiat",
      badgeColor: "#94A3B8",
      label: "Neinițiat"
    };
  }
  if (n.includes("elita") || n.includes("elite")) {
    return {
      fill: "#FF6B00",
      opacity: "0.96",
      cls: "level-elita",
      badgeColor: "#FFD600",
      label: "Elită"
    };
  }
  if (n.includes("avansat") || n.includes("advanced")) {
    return {
      fill: "#C04BFF",
      opacity: "0.92",
      cls: "level-avansat",
      badgeColor: "#C04BFF",
      label: "Avansat"
    };
  }
  if (n.includes("intermediar") || n.includes("intermediate")) {
    return {
      fill: "#00E5FF",
      opacity: "0.92",
      cls: "level-intermediar",
      badgeColor: "#00E5FF",
      label: "Intermediar"
    };
  }
  return {
    fill: "#00FF88",
    opacity: "0.9",
    cls: "level-incepator",
    badgeColor: "#00FF88",
    label: "Începător"
  };
}

function getAnatomyRecoveryColor(recoveryVal) {
  const val = recoveryVal !== undefined && recoveryVal !== null ? Number(recoveryVal) : 100;
  if (val < 50) return "#FF2E55";
  if (val < 90) return "#FFD600";
  return "#00FF88";
}

function syncDashboardNeonBadges() {
  const NEON_BADGE_MAP = {
    neinitiat: {
      text: "#94A3B8",
      bg: "rgba(42, 51, 71, 0.72)",
      border: "rgba(100, 116, 139, 0.65)",
      glow: "none"
    },
    incepator: {
      text: "#00FF88",
      bg: "rgba(0, 255, 136, 0.12)",
      border: "rgba(0, 255, 136, 0.42)",
      glow: "0 0 8px rgba(0, 255, 136, 0.22)"
    },
    intermediar: {
      text: "#00E5FF",
      bg: "rgba(0, 229, 255, 0.12)",
      border: "rgba(0, 229, 255, 0.42)",
      glow: "0 0 8px rgba(0, 229, 255, 0.22)"
    },
    avansat: {
      text: "#C04BFF",
      bg: "rgba(192, 75, 255, 0.14)",
      border: "rgba(192, 75, 255, 0.46)",
      glow: "0 0 8px rgba(192, 75, 255, 0.25)"
    },
    elita: {
      text: "#FFD600",
      bg: "rgba(255, 107, 0, 0.18)",
      border: "rgba(255, 214, 0, 0.52)",
      glow: "0 0 9px rgba(255, 107, 0, 0.32)"
    }
  };

  document.querySelectorAll("span, strong").forEach((el) => {
    if (el.children.length > 0) return;
    if (el.closest(".anatomy-legend, .anatomy-toggle, .anatomy-mode-toggle, nav, header")) return;

    const norm = String(el.textContent || "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

    const theme = NEON_BADGE_MAP[norm];
    if (!theme) return;

    const cls = typeof el.className === "string" ? el.className : "";
    const isBadgePill = /\b(rounded|px-|py-|bg-|border)\b/.test(cls);

    el.style.color = theme.text;
    if (isBadgePill) {
      el.style.backgroundColor = theme.bg;
      el.style.borderColor = theme.border;
      el.style.borderWidth = "1px";
      el.style.borderStyle = "solid";
      el.style.boxShadow = theme.glow;
    } else if (norm !== "neinitiat") {
      el.style.textShadow = `0 0 10px ${theme.border}`;
    }
  });
}

window.handleAnatomyMove = function (event) {
  const tooltip = document.getElementById("anatomy-floating-tooltip");
  if (!tooltip || !event) return;
  const offset = 16;
  const tw = tooltip.offsetWidth || 180;
  const th = tooltip.offsetHeight || 85;
  let x = event.clientX + offset;
  let y = event.clientY - th / 2;
  if (x + tw > window.innerWidth - 12) x = event.clientX - tw - offset;
  if (y < 12) y = 12;
  if (y + th > window.innerHeight - 12) y = window.innerHeight - th - 12;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
};

  document.querySelectorAll(".anatomy-muscle-zone.is-hovered").forEach((z) => z.classList.remove("is-hovered"));

  const MAX_TILT = 4;
  const CARD_SELECTOR = [
    ".exercise-card",
    ".exercises-grid > div",
    'button[onclick*="addExerciseToWorkout"]',
    'div[onclick*="addExerciseToWorkout"]',
    ".template-card",

    'button[onclick*="template"]:not([onclick*="delete"]):not([onclick*="remove"])',
    'div[onclick*="template"]:not([onclick*="delete"]):not([onclick*="remove"])'
  ].join(", ");

  let activeCard = null;
  let rafId = 0;
  let pendingEvent = null;

  const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

  const getEligibleCard = (target) => {
    if (!target || typeof target.closest !== "function") return null;
    const card = target.closest(CARD_SELECTOR);
    if (!card) return null;
    if (card.closest(".anatomy-card") || card.querySelector('input[type="range"]')) return null;

    const rect = card.getBoundingClientRect();
    if (rect.width < 90 || rect.height < 48 || rect.width > 680 || rect.height > 540) {
      return null;
    }
    return card;
  };

  const resetCard = (card) => {
    if (!card) return;
    card.classList.remove("titan-tilt-active");
    card.style.transform = "";

  const resetActiveCard = () => {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = 0;
    }
    pendingEvent = null;
    if (activeCard) {
      resetCard(activeCard);
      activeCard = null;
    }
  };

  const applyTiltFrame = () => {
    rafId = 0;
    if (!pendingEvent || !activeCard || !activeCard.isConnected) {
      resetActiveCard();
      return;
    }

    const rect = activeCard.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;

    const mx = pendingEvent.clientX - rect.left;
    const my = pendingEvent.clientY - rect.top;

    const nx = clamp(mx / rect.width - 0.5, -0.5, 0.5);
    const ny = clamp(my / rect.height - 0.5, -0.5, 0.5);

    const rotateX = clamp(-ny * 2 * MAX_TILT, -MAX_TILT, MAX_TILT);
    const rotateY = clamp(nx * 2 * MAX_TILT, -MAX_TILT, MAX_TILT);

    activeCard.style.setProperty("--mx", `${mx.toFixed(1)}px`);
    activeCard.style.setProperty("--my", `${my.toFixed(1)}px`);

    const card = getEligibleCard(e.target);
    if (card === activeCard) return;

    if (activeCard && (!card || card !== activeCard)) {
      resetCard(activeCard);

    activeCard = card;
    if (activeCard) {
      activeCard.classList.add("titan-tilt-active");

    const card = getEligibleCard(e.target);

    if (!card) {
      if (activeCard) resetActiveCard();
      return;
    }

    if (card !== activeCard) {
      if (activeCard) resetCard(activeCard);
      activeCard = card;
      activeCard.classList.add("titan-tilt-active");
    }

    pendingEvent = { clientX: e.clientX, clientY: e.clientY };
    if (!rafId) {
      rafId = requestAnimationFrame(applyTiltFrame);
    }
  });

    if (!activeCard) return;
    if (!e.relatedTarget || !activeCard.contains(e.relatedTarget)) {
      resetActiveCard();
    }
  });

function normalizeBestSetKey(str) {

    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function formatBestSetWeight(val) {
  const num = Math.round((Number(val) || 0) * 100) / 100;
  return Number.isInteger(num) ? String(num) : String(num);
}

function formatBestSetDate(rawDate) {
  if (!rawDate) return "";
  const d = new Date(rawDate);
  if (Number.isNaN(d.getTime())) return String(rawDate);
  try {
    return d.toLocaleDateString("ro-RO", {
      day: "numeric",
      month: "short",
      year: "numeric"
    });
  } catch (e) {
    return String(rawDate).slice(0, 10);
  }
}

function parseBestSetTimestamp(rawDate) {
  if (!rawDate) return 0;
  if (typeof rawDate === "number") return rawDate;
  const t = Date.parse(rawDate);
  return Number.isNaN(t) ? 0 : t;

function computeBestSetRaw1RM(weight, reps) {
  if (weight <= 0 || reps <= 0) return 0;
  return reps === 1 ? weight : weight * (1 + reps / 30);
}

// Compară 2 serii pentru alegerea Best Set-ului din istoric (cu data ca ultim criteriu)
function isBetterHistoricalSet(candidate, current) {
  if (!current) return true;
  const EPS = 1e-6;

  // 1. Scor 1RM Epley mai mare
  if (candidate.raw1RM > current.raw1RM + EPS) return true;
  if (candidate.raw1RM + EPS < current.raw1RM) return false;

  // 2. Egalitate de scor: pentru greutatea corpului (0 kg) câștigă repetările mai multe
  if (candidate.weight === 0 && current.weight === 0) {
    if (candidate.reps !== current.reps) return candidate.reps > current.reps;
    return candidate.timestamp > current.timestamp;
  }

  // 3. Egalitate de scor la greutăți: câștigă greutatea mai mare
  if (Math.abs(candidate.weight - current.weight) > EPS) {
    return candidate.weight > current.weight;
  }

  // 4. Ultimul criteriu: data cea mai recentă
  return candidate.timestamp > current.timestamp;
}

// Verifică strict dacă o serie din antrenamentul activ DEPĂȘEȘTE vechiul record
function doesSetBeatRecord(candidate, oldRecord) {
  if (!candidate) return false;
  if (!oldRecord) return true; // Primul record stabilit vreodată
  const EPS = 1e-6;

  if (candidate.raw1RM > oldRecord.raw1RM + EPS) return true;
  if (candidate.raw1RM + EPS < oldRecord.raw1RM) return false;

  if (candidate.weight === 0 && oldRecord.weight === 0) {
    return candidate.reps > oldRecord.reps;
  }
  return candidate.weight > oldRecord.weight + EPS;
}

function resolveExerciseIdentifiers(exerciseNameOrId) {
  const targetNorm = normalizeBestSetKey(exerciseNameOrId);
  const validKeys = new Set();
  if (targetNorm) validKeys.add(targetNorm);

  const catalog =
    (typeof state !== "undefined" && Array.isArray(state.exercises) && state.exercises.length
      ? state.exercises
      : typeof INITIAL_EXERCISES !== "undefined" && Array.isArray(INITIAL_EXERCISES)
        ? INITIAL_EXERCISES
        : []);

  const found = catalog.find(
    (ex) =>
      normalizeBestSetKey(ex.id) === targetNorm ||
      normalizeBestSetKey(ex.name) === targetNorm
  );

  if (found) {
    if (found.id) validKeys.add(normalizeBestSetKey(found.id));
    if (found.name) validKeys.add(normalizeBestSetKey(found.name));
  }
  return validKeys;
}

function getExerciseBestSet(exerciseNameOrId) {
  if (!exerciseNameOrId) return null;

  const workouts =
    (typeof state !== "undefined" &&
      (Array.isArray(state.workouts)
        ? state.workouts
        : Array.isArray(state.history)
          ? state.history
          : [])) ||
    [];

  if (!workouts.length) return null;

  const validKeys = resolveExerciseIdentifiers(exerciseNameOrId);
  let best = null;

  workouts.forEach((workout) => {
    if (!workout) return;
    const rawDate = workout.date || workout.createdAt || workout.timestamp || "";
    const timestamp = parseBestSetTimestamp(rawDate);
    const exercisesList = Array.isArray(workout.exercises) ? workout.exercises : [];

    exercisesList.forEach((ex) => {
      if (!ex) return;
      const exIdKey = normalizeBestSetKey(ex.exerciseId || ex.id);
      const exNameKey = normalizeBestSetKey(ex.name || ex.title);

      if (!validKeys.has(exIdKey) && !validKeys.has(exNameKey)) return;

      const sets = Array.isArray(ex.sets) ? ex.sets : [];
      sets.forEach((set) => {
        if (!set) return;
        // Ignoră seriile marcate explicit ca necompletate
        if (set.completed === false || set.done === false || set.checked === false) return;

        const reps = parseInt(set.reps, 10);
        if (!Number.isFinite(reps) || reps <= 0) return;

        const parsedWeight = parseFloat(set.weight ?? set.kg ?? 0);
        const weight = Number.isFinite(parsedWeight) && parsedWeight > 0 ? parsedWeight : 0;
        const raw1RM = computeBestSetRaw1RM(weight, reps);

        const candidate = {
          weight,
          reps,
          raw1RM,
          estimated1RM: Math.round(raw1RM * 10) / 10,
          date: rawDate,
          timestamp
        };

        if (isBetterHistoricalSet(candidate, best)) {
          best = candidate;
        }
      });
    });
  });

  if (!best) return null;

  return {
    weight: best.weight,
    reps: best.reps,
    estimated1RM: best.estimated1RM,
    raw1RM: best.raw1RM,
    date: best.date
  };
}

function getBestCompletedSetFromList(sets) {
  if (!Array.isArray(sets) || !sets.length) return null;
  let best = null;

  sets.forEach((set) => {
    if (!set) return;
    const isCompleted = set.completed === true || set.done === true || set.checked === true;
    if (!isCompleted) return;

    const reps = parseInt(set.reps, 10);
    if (!Number.isFinite(reps) || reps <= 0) return;

    const parsedWeight = parseFloat(set.weight ?? set.kg ?? 0);
    const weight = Number.isFinite(parsedWeight) && parsedWeight > 0 ? parsedWeight : 0;
    const raw1RM = computeBestSetRaw1RM(weight, reps);

    const candidate = {
      weight,
      reps,
      raw1RM,
      estimated1RM: Math.round(raw1RM * 10) / 10,
      timestamp: Date.now()
    };

    if (isBetterHistoricalSet(candidate, best)) {
      best = candidate;
    }
  });

  return best;
}

function formatBestSetDisplayText(best) {
  if (!best) return "";
  if (best.weight > 0) {
    return `${formatBestSetWeight(best.weight)} kg × ${best.reps} rep`;
  }
  return `Greutatea corpului × ${best.reps} rep`;
}

  /* === MODIFICAREA #2: SUB-GRUPE ANATOMICE, ALTERNATIVE & ÎNLOCUIRE RAPIDĂ LA SALĂ === */

function normalizeAltText(str) {
  return String(str || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function escapeSingleQuoteJs(str) {
  return String(str || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function getAllExercisesCatalog() {
  if (typeof state !== "undefined" && Array.isArray(state.exercises) && state.exercises.length) {
    return state.exercises;
  }
  if (typeof INITIAL_EXERCISES !== "undefined" && Array.isArray(INITIAL_EXERCISES)) {
    return INITIAL_EXERCISES;
  }
  return [];
}

function resolveExerciseObject(exerciseOrId) {
  if (!exerciseOrId) return null;
  if (typeof exerciseOrId === "object") return exerciseOrId;
  const key = normalizeAltText(exerciseOrId);
  return (
    getAllExercisesCatalog().find(
      (ex) => normalizeAltText(ex.id) === key || normalizeAltText(ex.name) === key
    ) || null
  );
}

function getExerciseSubMuscle(exerciseOrId) {
  const ex = resolveExerciseObject(exerciseOrId);
  if (!ex) return "General";

  const group = normalizeAltText(ex.primaryMuscle || "");
  const text = normalizeAltText(`${ex.id || ""} ${ex.name || ""} ${ex.subGroup || ""}`);
  const has = (...terms) => terms.some((t) => text.includes(t));

  // 1. PIEPT
  if (group.includes("piept") || group.includes("chest")) {
    if (has("inclinat", "incline", "superior", "upper", "de jos in sus", "low to high", "low-to-high")) {
      return "Piept Superior";
    }
    if (has("declinat", "decline", "inferior", "lower", "paralele", "dips", "de sus in jos", "high to low", "high-to-low")) {
      return "Piept Inferior";
    }
    return "Piept Median";
  }

  // 2. SPATE
  if (group.includes("spate") || group.includes("back")) {
    if (has("trapez", "shrug", "ridicari de umeri", "ridicari umeri", "farmer")) {
      return "Trapez";
    }
    if (has("lombar", "lower back", "hiperextens", "hyperextens", "extensii spate", "back extension", "deadlift", "indreptari", "good morning")) {
      return "Lombari";
    }
    if (has("tractiun", "pulldown", "helcometru", "pull-up", "pullup", "chin-up", "chinup", "pullover", "dorsal", "lat ", "lats", "straight arm", "brate intinse")) {
      return "Marele Dorsal (Lats)";
    }
    if (has("ramat", "row", "romboizi", "spate superior", "upper back", "t-bar", "tbar", "pendlay", "seal", "aplecat", "sezut", "cablu")) {
      return "Spate Superior & Romboizi";
    }
    return "Marele Dorsal (Lats)";
  }

  // 3. PICIOARE
  if (group.includes("picioare") || group.includes("legs")) {
    if (has("aductor", "adductor", "coapse interior", "interior coaps")) {
      return "Aductori";
    }
    if (has("gamb", "calf", "calves", "varfuri", "soleus")) {
      return "Gambe";
    }
    if (has("fesier", "glute", "hip thrust", "podul", "kickback", "abductor", "abductori")) {
      return "Fesieri";
    }
    if (has("femural", "hamstring", "ischiogamb", "leg curl", "flexii picioare", "flexii femural", "romanes", "romanian", "rdl", "stiff", "picioare drepte", "nordic")) {
      return "Ischiogambieri (Biceps Femural)";
    }
    return "Cvadriceps";
  }

  // 4. UMERI
  if (group.includes("umeri") || group.includes("shoulder")) {
    if (has("posterior", "rear", "face pull", "facepull", "invers", "reverse", "aplecat", "bent over", "spate umeri")) {
      return "Deltoid Posterior";
    }
    if (has("lateral", "side raise", "laterale", "ramat vertical", "upright")) {
      return "Deltoid Lateral";
    }
    return "Deltoid Anterior";
  }

  // 5. BRAȚE
  if (group.includes("brate") || group.includes("arm")) {
    if (has("antebrat", "forearm", "wrist", "incheietur", "reverse curl", "priza inversa")) {
      return "Antebraț";
    }
    if (has("triceps", "extensii", "pushdown", "skull", "frances", "french", "kickback", "paralele", "dips", "priza ingusta", "close grip", "overhead", "funie", "coarda")) {
      return "Triceps";
    }
    return "Biceps";
  }

  // 6. ABDOMEN / CORE
  if (group.includes("abdomen") || group.includes("core") || group.includes("abs") || has("abdomen", "crunch", "plank", "plansa", "ab wheel", "ridicari de picioare", "leg raise", "russian twist", "woodchop")) {
    return "Abdomen / Core";
  }

  // Fallback general pentru exerciții custom fără grupă standard
  if (has("inclinat", "piept superior")) return "Piept Superior";
  if (has("piept", "bench", "peck deck", "flotari")) return "Piept Median";
  if (has("tractiun", "pulldown", "helcometru", "pullover")) return "Marele Dorsal (Lats)";
  if (has("ramat", "row")) return "Spate Superior & Romboizi";
  if (has("genuflex", "squat", "leg press", "leg extension")) return "Cvadriceps";
  if (has("rdl", "leg curl", "femural")) return "Ischiogambieri (Biceps Femural)";
  if (has("biceps", "curl")) return "Biceps";
  if (has("triceps", "pushdown", "skull")) return "Triceps";

  return ex.subGroup || ex.primaryMuscle || "General";
}

function getExerciseAlternatives(exerciseOrId) {
  const current = resolveExerciseObject(exerciseOrId);
  if (!current) {
    return { subMuscle: "General", isFallbackGroup: false, alternatives: [] };
  }

  const catalog = getAllExercisesCatalog();
  const subMuscle = getExerciseSubMuscle(current);
  const currentIdNorm = normalizeAltText(current.id);
  const currentGroupNorm = normalizeAltText(current.primaryMuscle);

  const exactMatches = catalog.filter(
    (other) =>
      normalizeAltText(other.id) !== currentIdNorm &&
      getExerciseSubMuscle(other) === subMuscle
  );

  if (exactMatches.length > 0) {
    return {
      subMuscle,
      isFallbackGroup: false,
      alternatives: exactMatches
    };
  }

  // Fallback discret pe aceeași grupă mare dacă exercițiul este singurul din sub-grupa lui
  const groupMatches = catalog.filter(
    (other) =>
      normalizeAltText(other.id) !== currentIdNorm &&
      normalizeAltText(other.primaryMuscle) === currentGroupNorm
  );

  return {
    subMuscle,
    isFallbackGroup: true,
    alternatives: groupMatches
  };
}

function formatAltShortPR(exercise) {
  if (typeof getExerciseBestSet !== "function") return "";
  const best = getExerciseBestSet(exercise.id || exercise.name);
  if (!best) return "";
  const wText = typeof formatBestSetWeight === "function" ? formatBestSetWeight(best.weight) : String(best.weight);
  return best.weight > 0 ? `${wText} kg × ${best.reps}` : `BW × ${best.reps} rep`;
}

const TITAN_ANATOMY_GROUPS = ["Piept", "Spate", "Picioare", "Umeri", "Brațe"];

function normalizeAnatomyGroupKey(str) {
  return String(str || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function getAnatomyWorkoutsList() {
  if (typeof state === "undefined") return [];
  if (Array.isArray(state.workouts)) return state.workouts;
  if (Array.isArray(state.history)) return state.history;
  return [];
}

function getAnatomyCatalogList() {
  if (typeof state !== "undefined" && Array.isArray(state.exercises) && state.exercises.length) {
    return state.exercises;
  }
  if (typeof INITIAL_EXERCISES !== "undefined" && Array.isArray(INITIAL_EXERCISES)) {
    return INITIAL_EXERCISES;
  }
  return [];
}

function resolveMuscleGroupFromWorkoutEx(workoutEx, catalog) {
  const rawId = normalizeAnatomyGroupKey(workoutEx.exerciseId || workoutEx.id);
  const rawName = normalizeAnatomyGroupKey(workoutEx.name || workoutEx.title);

  const matchCatalog = catalog.find(
    (c) =>
      (rawId && normalizeAnatomyGroupKey(c.id) === rawId) ||
      (rawName && normalizeAnatomyGroupKey(c.name) === rawName)
  );

  const groupRaw = normalizeAnatomyGroupKey(
    (matchCatalog && matchCatalog.primaryMuscle) ||
      workoutEx.primaryMuscle ||
      workoutEx.muscleGroup ||
      workoutEx.muscle ||
      ""
  );

  if (groupRaw.includes("piept") || groupRaw.includes("chest")) return "Piept";
  if (groupRaw.includes("spate") || groupRaw.includes("back")) return "Spate";
  if (groupRaw.includes("picioare") || groupRaw.includes("leg")) return "Picioare";
  if (groupRaw.includes("umeri") || groupRaw.includes("shoulder")) return "Umeri";
  if (groupRaw.includes("brate") || groupRaw.includes("arm") || groupRaw.includes("bicep") || groupRaw.includes("tricep")) return "Brațe";

  return "";
}

function formatRelativeWorkoutTime(timestamp) {
  if (!timestamp) return "Nicio sesiune înregistrată";
  const diffMs = Math.max(0, Date.now() - timestamp);
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);

  if (diffMins < 60) return diffMins <= 2 ? "Chiar acum" : `Acum ${diffMins} min`;
  if (diffHours < 24) return diffHours === 1 ? "Acum 1 oră" : `Acum ${diffHours} ore`;
  if (diffDays === 1) return "Ieri";
  if (diffDays < 30) return `Acum ${diffDays} zile`;

  try {
    return new Date(timestamp).toLocaleDateString("ro-RO", { day: "numeric", month: "short" });
  } catch (e) {
    return `Acum ${diffDays} zile`;
  }
}

// Extrage ultima sesiune, nr. de serii și exercițiul cu cel mai bun scor pe grupa dată
function getMuscleHistoryDetails(muscleName) {
  const workouts = getAnatomyWorkoutsList();
  const catalog = getAnatomyCatalogList();

  let lastTimestamp = 0;
  let lastSessionSets = 0;
  let bestExerciseName = "";
  let bestRaw1RM = 0;
  let bestWeight = 0;
  let bestReps = 0;

  workouts.forEach((w) => {
    if (!w || !Array.isArray(w.exercises)) return;
    const rawDate = w.date || w.createdAt || w.timestamp || "";
    const ts = typeof rawDate === "number" ? rawDate : Date.parse(rawDate) || 0;

    let setsInThisWorkout = 0;

    w.exercises.forEach((wEx) => {
      if (!wEx) return;
      const mappedGroup = resolveMuscleGroupFromWorkoutEx(wEx, catalog);
      if (mappedGroup !== muscleName) return;

      const catMatch = catalog.find(
        (c) =>
          c.id === (wEx.exerciseId || wEx.id) ||
          normalizeAnatomyGroupKey(c.name) === normalizeAnatomyGroupKey(wEx.name || wEx.title)
      );
      const displayName = (catMatch && catMatch.name) || wEx.name || wEx.title || "";

      const sets = Array.isArray(wEx.sets) ? wEx.sets : [];
      sets.forEach((s) => {
        if (!s) return;
        if (s.completed === false || s.done === false || s.checked === false) return;

        const reps = parseInt(s.reps, 10);
        if (!Number.isFinite(reps) || reps <= 0) return;

        setsInThisWorkout += 1;

        const parsedW = parseFloat(s.weight ?? s.kg ?? 0);
        const weight = Number.isFinite(parsedW) && parsedW > 0 ? parsedW : 0;
        const raw1RM = weight > 0 ? (reps === 1 ? weight : weight * (1 + reps / 30)) : 0;

        const isBetter =
          raw1RM > bestRaw1RM + 1e-6 ||
          (Math.abs(raw1RM - bestRaw1RM) <= 1e-6 &&
            ((weight === 0 && bestWeight === 0 && reps > bestReps) || weight > bestWeight));

        if (isBetter && displayName) {
          bestRaw1RM = raw1RM;
          bestWeight = weight;
          bestReps = reps;
          bestExerciseName = displayName;
        }
      });
    });

    if (setsInThisWorkout > 0 && ts >= lastTimestamp) {
      lastTimestamp = ts;
      lastSessionSets = setsInThisWorkout;
    }
  });

  return {
    lastTimestamp,
    lastSessionSets,
    bestExerciseName,
    best1RM: Math.round(bestRaw1RM * 10) / 10,
    bestWeight,
    bestReps
  };
}

// Calculează timpul exact rămas până la 100% recuperare
function estimateRecoveryHoursRemaining(muscleName, recoveryPct, infoObj, historyInfo) {
  const rec = Math.max(0, Math.min(100, Math.round(Number(recoveryPct ?? 100))));
  if (rec >= 100) {
    return { isFull: true, hours: 0, text: "Recuperat complet ✓" };
  }

  // Dacă map-ul tău de recuperare expune deja orele rămase, le folosim direct
  const directHours = infoObj && (infoObj.hoursRemaining ?? infoObj.remainingHours ?? infoObj.hoursLeft);
  if (typeof directHours === "number" && Number.isFinite(directHours) && directHours > 0) {
    const h = Math.ceil(directHours);
    return {
      isFull: false,
      hours: h,
      text: h === 1 ? "~1 oră rămasă până la 100%" : `~${h} ore rămase până la 100%`
    };
  }

  const isLargeMuscle = muscleName === "Piept" || muscleName === "Spate" || muscleName === "Picioare";
  const defaultWindowHours = isLargeMuscle ? 72 : 48;

  let remainingHours = ((100 - rec) / 100) * defaultWindowHours;

  // Deducem exact fereastra reală din timpul scurs de la ultima sesiune (când e în plaja fiziologică 24h–96h)
  if (historyInfo && historyInfo.lastTimestamp > 0) {
    const elapsedHours = Math.max(0, (Date.now() - historyInfo.lastTimestamp) / 3600000);
    if (elapsedHours >= 1 && rec >= 8) {
      const inferredWindow = elapsedHours / (rec / 100);
      if (inferredWindow >= 20 && inferredWindow <= 108) {
        remainingHours = Math.max(0.5, inferredWindow - elapsedHours);
      }
    }
  }

  if (remainingHours < 1) {
    return { isFull: false, hours: 1, text: "< 1 oră rămasă până la 100%" };
  }

  const rounded = Math.round(remainingHours);
  return {
    isFull: false,
    hours: rounded,
    text: rounded === 1 ? "~1 oră rămasă până la 100%" : `~${rounded} ore rămase până la 100%`
  };
}

// Calculează streak-ul real de zile consecutive (fallback dacă getOverallStats nu expune streakDays)
function computeWorkoutStreakDays(workouts) {
  if (!Array.isArray(workouts) || !workouts.length) return 0;

  const toLocalDayKey = (d) => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };

  const daySet = new Set();
  workouts.forEach((w) => {
    const raw = w && (w.date || w.createdAt || w.timestamp);
    if (!raw) return;
    const d = new Date(raw);
    if (!Number.isNaN(d.getTime())) daySet.add(toLocalDayKey(d));
  });

  if (!daySet.size) return 0;

  const cursor = new Date();
  cursor.setHours(12, 0, 0, 0);

  // Dacă nu te-ai antrenat încă azi, verificăm de ieri
  if (!daySet.has(toLocalDayKey(cursor))) {
    cursor.setDate(cursor.getDate() - 1);
    if (!daySet.has(toLocalDayKey(cursor))) return 0;
  }

  let streak = 0;
  while (daySet.has(toLocalDayKey(cursor))) {
    streak += 1;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

                analyses = vals;
              } else {
                analyses = TITAN_ANATOMY_GROUPS.map((g) => analyzeMuscleStrength(g)).filter(Boolean);
              }
            }
          }
        }

        if (!Array.isArray(analyses) || !analyses.length) {
          analyses = TITAN_ANATOMY_GROUPS.map((g) => {
            const info = dataMap[g] || {};
            return {
              muscle: g,
              group: g,
              oneRM: Number(info.oneRM) || 0,
              best1RM: Number(info.oneRM) || 0,
              level: info.level || "Neinițiat"
            };
          });
        }

        overall = getOverallStats(analyses) || {};
      } catch (innerErr) {
        overall = {};
      }
    }

    // Total sesiuni
    const totalSessions =
      Number(overall.totalSessions ?? overall.sessions ?? overall.totalWorkouts ?? workouts.length) || 0;

    // Volum total (kg)
    let computedVolume = 0;
    workouts.forEach((w) => {
      if (!w || !Array.isArray(w.exercises)) return;
      w.exercises.forEach((ex) => {
        if (!ex || !Array.isArray(ex.sets)) return;
        ex.sets.forEach((s) => {
          if (!s || s.completed === false || s.done === false || s.checked === false) return;
          const wt = parseFloat(s.weight ?? s.kg ?? 0);
          const rp = parseInt(s.reps, 10);
          if (Number.isFinite(wt) && wt > 0 && Number.isFinite(rp) && rp > 0) {
            computedVolume += wt * rp;
          }
        });
      });
    });

    const rawVol = overall.totalVolumeKg ?? overall.totalVolume ?? overall.volumeKg;
    const totalVolumeKg = Math.round(
      typeof rawVol === "number" && Number.isFinite(rawVol) ? rawVol : computedVolume
    );

    // Nivel numeric
    let level = 0;
    const rawLevel = overall.levelNumber ?? overall.levelNum ?? overall.level ?? overall.currentLevel;
    if (typeof rawLevel === "number" && Number.isFinite(rawLevel)) {
      level = rawLevel;
    } else if (typeof rawLevel === "string") {
      const digitMatch = rawLevel.match(/\d+/);
      if (digitMatch) {
        level = parseInt(digitMatch[0], 10) || 0;
      } else {
        const tierNumMap = { neinitiat: 0, incepator: 1, intermediar: 2, avansat: 3, elita: 4 };
        const normLvl = normalizeAnatomyGroupKey(rawLevel);
        level =
          normLvl in tierNumMap
            ? tierNumMap[normLvl]
            : totalSessions > 0
              ? Math.floor(totalSessions / 3) + 1
              : 0;
      }
    } else if (totalSessions > 0) {
      level = Math.floor(totalSessions / 3) + 1;
    }

    // Streak zile
    const rawStreak = overall.streakDays ?? overall.streak ?? overall.currentStreak ?? overall.activeStreak;
    const streakDays =
      typeof rawStreak === "number" && Number.isFinite(rawStreak)
        ? Math.max(0, Math.round(rawStreak))
        : computeWorkoutStreakDays(workouts);

    const buildPublicMuscle = (roName) => {
      const info = dataMap[roName] || { level: "Neinițiat", oneRM: 0 };
      const rm = Math.round((Number(info.oneRM) || 0) * 10) / 10;
      const tier =
        typeof getAnatomyLevelStyle === "function"
          ? getAnatomyLevelStyle(info.level, rm).label
          : rm > 0
            ? String(info.level || "Începător")
            : "Neinițiat";
      const hist = getMuscleHistoryDetails(roName);
      return {
        rm,
        tier,
        bestExercise: hist.bestExerciseName || ""
      };
    };

    const publicStats = {
      level,
      totalSessions,
      streakDays,
      totalVolumeKg,
      muscles: {
        chest: buildPublicMuscle("Piept"),
        back: buildPublicMuscle("Spate"),
        legs: buildPublicMuscle("Picioare"),
        shoulders: buildPublicMuscle("Umeri"),
        arms: buildPublicMuscle("Brațe")
      }
    };

    const serialized = JSON.stringify(publicStats);
    const prevStored = localStorage.getItem("titanlift_public_stats");

    if (forceDispatch || prevStored !== serialized || !window.__titanPublicStatsDispatchedOnce) {
      localStorage.setItem("titanlift_public_stats", serialized);
      window.__titanPublicStatsDispatchedOnce = true;
      window.dispatchEvent(new CustomEvent("titan-public-stats-updated"));
    }
  } catch (err) {
    console.warn("Eroare export titanlift_public_stats:", err);
  }
};

function getLocalDateKey(dateValue) {
  if (!dateValue) return "";

  if (typeof dateValue === "string") {
    const trimmed = dateValue.trim();
    // Dacă este deja în format curat YYYY-MM-DD, îl returnăm direct (fără risc de shift UTC)
    if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) {
      return trimmed;
    }
  }

  const d = dateValue instanceof Date ? dateValue : new Date(dateValue);
  if (Number.isNaN(d.getTime())) return "";

  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function formatConsistencyShortDate(dateKey) {
  if (!dateKey || !/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return String(dateKey || "");
  const [y, m, d] = dateKey.split("-").map(Number);
  const localDate = new Date(y, m - 1, d);
  try {
    return localDate.toLocaleDateString("ro-RO", {
      day: "numeric",
      month: "short"
    });
  } catch (e) {
    return `${d}.${m}`;
  }
}

function formatDayDetailWeight(val) {
  const num = Math.round((Number(val) || 0) * 100) / 100;
  return Number.isInteger(num) ? String(num) : String(num);
}

function formatDayDetailDuration(workout) {
  if (!workout) return "—";
  const secVal = workout.durationSeconds ?? workout.durationSec ?? workout.elapsedSeconds;
  if (typeof secVal === "number" && Number.isFinite(secVal) && secVal > 0) {
    const mins = Math.max(1, Math.round(secVal / 60));
    if (mins >= 60) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return m > 0 ? `${h}h ${m}m` : `${h}h`;
    }
    return `${mins} min`;
  }

  const minVal = workout.durationMinutes ?? workout.durationMin;
  if (typeof minVal === "number" && Number.isFinite(minVal) && minVal > 0) {
    return `${Math.round(minVal)} min`;
  }

  if (typeof workout.duration === "string" && workout.duration.trim()) {
    return workout.duration.trim();
  }

  if (typeof workout.duration === "number" && Number.isFinite(workout.duration) && workout.duration > 0) {
    // Dacă valoarea numerică pare salvată în secunde (>= 240), o convertim în minute
    const mins = workout.duration >= 240 ? Math.round(workout.duration / 60) : Math.round(workout.duration);
    return `${Math.max(1, mins)} min`;
  }

  return "—";
}

function resolveDayDetailExerciseInfo(workoutEx) {
  const catalog =
    typeof state !== "undefined" && Array.isArray(state.exercises) && state.exercises.length
      ? state.exercises
      : typeof INITIAL_EXERCISES !== "undefined" && Array.isArray(INITIAL_EXERCISES)
        ? INITIAL_EXERCISES
        : [];

  const norm = (s) =>
    String(s || "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

  const targetId = norm(workoutEx.exerciseId || workoutEx.id);
  const targetName = norm(workoutEx.name || workoutEx.title);

  const found = catalog.find(
    (c) => (targetId && norm(c.id) === targetId) || (targetName && norm(c.name) === targetName)
  );

  return {
    name: (found && found.name) || workoutEx.name || workoutEx.title || "Exercițiu",
    muscle: (found && found.primaryMuscle) || workoutEx.primaryMuscle || workoutEx.muscleGroup || ""
  };
}

  /* === MODIFICAREA #8: AUTO-DENUMIRE INTELIGENTĂ & WORKOUT-URI PROPUSE DIN ISTORIC === */

function normalizeSmartText(str) {
  return String(str || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function getSmartExercisesCatalog() {
  if (typeof state !== "undefined" && Array.isArray(state.exercises) && state.exercises.length) {
    return state.exercises;
  }
  if (typeof INITIAL_EXERCISES !== "undefined" && Array.isArray(INITIAL_EXERCISES)) {
    return INITIAL_EXERCISES;
  }
  return [];
}

function resolveCatalogExerciseForSmart(workoutEx) {
  if (!workoutEx) return null;
  const catalog = getSmartExercisesCatalog();

  if (typeof workoutEx === "string") {
    const key = normalizeSmartText(workoutEx);
    return catalog.find((c) => normalizeSmartText(c.id) === key || normalizeSmartText(c.name) === key) || null;
  }

  const targetId = normalizeSmartText(workoutEx.exerciseId || workoutEx.id);
  const targetName = normalizeSmartText(workoutEx.name || workoutEx.title);

  return (
    catalog.find(
      (c) => (targetId && normalizeSmartText(c.id) === targetId) || (targetName && normalizeSmartText(c.name) === targetName)
    ) || workoutEx
  );
}

function classifyExerciseForSmartName(workoutEx) {
  const ex = resolveCatalogExerciseForSmart(workoutEx);
  if (!ex) return { bucket: "", isRearDelt: false };

  const subRaw =
    typeof getExerciseSubMuscle === "function"
      ? getExerciseSubMuscle(ex)
      : ex.subGroup || ex.primaryMuscle || "";
  const sub = normalizeSmartText(subRaw);
  const prim = normalizeSmartText(ex.primaryMuscle || ex.muscleGroup || "");
  const nameText = normalizeSmartText(ex.name || ex.title || "");

  // 1. Sub-grupe exacte (prioritate maximă — separă Biceps / Triceps / Deltoid Posterior / Core)
  if (sub.includes("biceps") && !sub.includes("femural")) return { bucket: "biceps", isRearDelt: false };
  if (sub.includes("triceps")) return { bucket: "triceps", isRearDelt: false };
  if (sub.includes("antebrat") || sub.includes("forearm")) return { bucket: "forearms", isRearDelt: false };
  if (sub.includes("abdomen") || sub.includes("core") || prim.includes("abdomen") || prim.includes("core")) {
    return { bucket: "core", isRearDelt: false };
  }
  if (sub.includes("deltoid posterior") || sub.includes("rear")) {
    return { bucket: "shoulders", isRearDelt: true };
  }
  if (sub.includes("deltoid") || sub.includes("umeri") || prim.includes("umeri") || prim.includes("shoulder")) {
    return { bucket: "shoulders", isRearDelt: false };
  }
  if (sub.includes("piept") || prim.includes("piept") || prim.includes("chest")) {
    return { bucket: "chest", isRearDelt: false };
  }
  if (
    sub.includes("dorsal") ||
    sub.includes("spate") ||
    sub.includes("trapez") ||
    sub.includes("lombar") ||
    sub.includes("romboizi") ||
    prim.includes("spate") ||
    prim.includes("back")
  ) {
    return { bucket: "back", isRearDelt: false };
  }
  if (
    sub.includes("cvadriceps") ||
    sub.includes("ischiogamb") ||
    sub.includes("femural") ||
    sub.includes("fesier") ||
    sub.includes("aductor") ||
    sub.includes("gamb") ||
    prim.includes("picioare") ||
    prim.includes("leg")
  ) {
    return { bucket: "legs", isRearDelt: false };
  }

  // Fallback suplimentar pentru exerciții custom cu grupa „Brațe”
  if (prim.includes("brate") || prim.includes("arm")) {
    if (nameText.includes("triceps") || nameText.includes("pushdown") || nameText.includes("extensii") || nameText.includes("skull") || nameText.includes("dips")) {
      return { bucket: "triceps", isRearDelt: false };
    }
    if (nameText.includes("antebrat") || nameText.includes("wrist")) {
      return { bucket: "forearms", isRearDelt: false };
    }
    return { bucket: "biceps", isRearDelt: false };
  }

  return { bucket: "", isRearDelt: false };
}

function countWorkingSetsForSmartName(workoutEx) {
  if (!workoutEx || !Array.isArray(workoutEx.sets) || workoutEx.sets.length === 0) {
    return 1;
  }
  const completedValid = workoutEx.sets.filter((s) => {
    if (!s) return false;
    if (s.completed === false || s.done === false || s.checked === false) return false;
    const r = parseInt(s.reps, 10);
    return Number.isFinite(r) && r > 0;
  }).length;

  return completedValid > 0 ? completedValid : Math.max(1, workoutEx.sets.length);
}

// 1. Funcția principală de auto-denumire inteligentă
function generateSmartWorkoutName(exercises) {
  if (!Array.isArray(exercises) || exercises.length === 0) {
    return "Custom Workout";
  }

  const counts = {
    chest: 0,
    back: 0,
    legs: 0,
    shoulders: 0,
    biceps: 0,
    triceps: 0,
    forearms: 0,
    core: 0
  };
  let nonRearShoulderSets = 0;

  exercises.forEach((wEx) => {
    if (!wEx) return;
    const { bucket, isRearDelt } = classifyExerciseForSmartName(wEx);
    if (!bucket || !(bucket in counts)) return;

    const setWeight = countWorkingSetsForSmartName(wEx);
    counts[bucket] += setWeight;
    if (bucket === "shoulders" && !isRearDelt) {
      nonRearShoulderSets += setWeight;
    }
  });

  const allBuckets = Object.keys(counts).filter((k) => counts[k] > 0);
  if (allBuckets.length === 0) return "Custom Workout";

  const maxSets = Math.max(...allBuckets.map((k) => counts[k]));

  // Ignoră grupele secundare cu o singură serie accidentală când există grupe principale clare (3+ serii)
  let significant = allBuckets.filter((k) => {
    if (maxSets >= 3 && counts[k] <= 1) return false;
    return true;
  });

  if (significant.length === 0) significant = allBuckets;

  // Ignoră accesoriile minore (Antebraț / Core) dacă există grupe majore clare și au maxim 2 serii de final
  const majorGroups = ["chest", "back", "legs", "shoulders", "biceps", "triceps"];
  const hasMajor = significant.some((k) => majorGroups.includes(k));
  if (hasMajor) {
    significant = significant.filter((k) => {
      if (k === "forearms") return false;
      if (k === "core" && maxSets >= 4 && counts.core <= 2) return false;
      return true;
    });
  }

  const has = (k) => significant.includes(k);
  const hasChest = has("chest");
  const hasBack = has("back");
  const hasLegs = has("legs");
  const hasShoulders = has("shoulders");
  const hasBiceps = has("biceps");
  const hasTriceps = has("triceps");
  const hasCore = has("core");
  const hasForearms = has("forearms");

  const hasFrontOrSideShoulders = hasShoulders && nonRearShoulderSets > (maxSets >= 3 ? 1 : 0);

  // A. O singură grupă principală
  if (significant.length === 1) {
    const singleMap = {
      chest: "Chest Day",
      back: "Back Day",
      legs: "Leg Day",
      shoulders: "Shoulders Day",
      biceps: "Biceps Day",
      triceps: "Triceps Day",
      forearms: "Arms Day",
      core: "Core Day"
    };
    return singleMap[significant[0]] || "Custom Workout";
  }

  // B. Combinații consacrate
  // 1. Arms Day: Biceps + Triceps (fără Piept / Spate / Picioare / Umeri)
  if (hasBiceps && hasTriceps && !hasChest && !hasBack && !hasLegs && !hasShoulders) {
    return "Arms Day";
  }

  // 2. Push Day: Piept + Umeri + Triceps (fără Spate / Picioare / Biceps)
  if (hasChest && hasShoulders && hasTriceps && !hasBack && !hasLegs && !hasBiceps) {
    return "Push Day";
  }

  // 3. Pull Day: Spate + Biceps (+ eventual Deltoid Posterior, fără Piept / Picioare / Triceps / Umeri front-lateral)
  if (hasBack && hasBiceps && !hasChest && !hasLegs && !hasTriceps && !hasFrontOrSideShoulders) {
    return "Pull Day";
  }

  // 4. Upper Body Day: Piept + Spate (+ eventual Umeri / Brațe, fără Picioare)
  if (hasChest && hasBack && !hasLegs) {
    return "Upper Body Day";
  }

  // 5. Picioare + partea superioară:
  //    - exact Picioare + Umeri -> Legs & Shoulders Day
  //    - orice altă combinație Picioare + grupă superioară -> Full Body Day
  const hasAnyUpper = hasChest || hasBack || hasShoulders || hasBiceps || hasTriceps;
  if (hasLegs && hasAnyUpper) {
    if (hasShoulders && !hasChest && !hasBack && !hasBiceps && !hasTriceps) {
      return counts.shoulders > counts.legs ? "Shoulders & Legs Day" : "Legs & Shoulders Day";
    }
    return "Full Body Day";
  }

  // 6. Combinații cu ambele brațe + 1 grupă superioară (ex. Shoulders & Arms Day, Chest & Arms Day, Back & Arms Day)
  if (hasBiceps && hasTriceps && !hasLegs) {
    const armsSets = counts.biceps + counts.triceps;
    if (hasShoulders && !hasChest && !hasBack) {
      return armsSets > counts.shoulders ? "Arms & Shoulders Day" : "Shoulders & Arms Day";
    }
    if (hasChest && !hasBack && !hasShoulders) {
      return armsSets > counts.chest ? "Arms & Chest Day" : "Chest & Arms Day";
    }
    if (hasBack && !hasChest && !hasShoulders) {
      return armsSets > counts.back ? "Arms & Back Day" : "Back & Arms Day";
    }
  }

  // C. Combinații de 2 grupe (sau top 2 grupe ordonate descrescător după numărul de serii)
  const labelMap = {
    chest: "Chest",
    back: "Back",
    legs: "Legs",
    shoulders: "Shoulders",
    biceps: "Biceps",
    triceps: "Triceps",
    core: "Core",
    forearms: "Arms"
  };

  const priorityTieBreaker = {
    legs: 8,
    back: 7,
    chest: 6,
    shoulders: 5,
    triceps: 4,
    biceps: 3,
    core: 2,
    forearms: 1
  };

  const sorted = [...significant].sort((a, b) => {
    if (counts[b] !== counts[a]) return counts[b] - counts[a];
    return (priorityTieBreaker[b] || 0) - (priorityTieBreaker[a] || 0);
  });

  const first = labelMap[sorted[0]] || "Strength";
  const second = labelMap[sorted[1]];
  if (second && second !== first) {
    return `${first} & ${second} Day`;
  }
  return `${first} Day`;
}

// 2. Generare dinamică de Workout-uri Propuse din istoric (fără duplicate, păstrând cea mai recentă variantă)
function getSmartProposedWorkouts(maxItems = 8) {
  const workouts =
    typeof state !== "undefined"
      ? Array.isArray(state.workouts)
        ? state.workouts
        : Array.isArray(state.history)
          ? state.history
          : []
      : [];

  if (!workouts.length) return [];

  const catalog = getSmartExercisesCatalog();

  // Sortăm descrescător după dată (cele mai recente primele)
  const sortedWorkouts = [...workouts]
    .map((w, idx) => {
      const rawDate = w && (w.date || w.createdAt || w.timestamp);
      const ts = typeof rawDate === "number" ? rawDate : Date.parse(rawDate) || idx;
      return { workout: w, ts, rawDate };
    })
    .sort((a, b) => b.ts - a.ts);

  const bySmartName = new Map();

  for (const entry of sortedWorkouts) {
    const w = entry.workout;
    if (!w || !Array.isArray(w.exercises) || w.exercises.length === 0) continue;

    // Rezolvăm exercițiile existente în catalog și eliminăm eventuale duplicate din aceeași sesiune
    const seenExIds = new Set();
    const cleanExercises = [];

    w.exercises.forEach((wEx) => {
      if (!wEx) return;
      const catEx = resolveCatalogExerciseForSmart(wEx);
      const matchedInCatalog =
        catEx && catEx.id
          ? catalog.find((c) => normalizeSmartText(c.id) === normalizeSmartText(catEx.id))
          : null;

      if (!matchedInCatalog) return;
      if (seenExIds.has(matchedInCatalog.id)) return;
      seenExIds.add(matchedInCatalog.id);

      const setsCount = Array.isArray(wEx.sets) && wEx.sets.length > 0 ? Math.min(8, Math.max(1, wEx.sets.length)) : 3;
      cleanExercises.push({
        exerciseId: matchedInCatalog.id,
        name: matchedInCatalog.name,
        setsCount
      });
    });

    if (cleanExercises.length === 0) continue;

    const smartName = generateSmartWorkoutName(w.exercises);
    if (!smartName || smartName === "Custom Workout") continue;

    // Fără duplicate: păstrăm doar cea mai recentă versiune pentru fiecare nume inteligent
    if (!bySmartName.has(smartName)) {
      bySmartName.set(smartName, {
        name: smartName,
        exercises: cleanExercises,
        lastDateRaw: entry.rawDate,
        lastTimestamp: entry.ts
      });
    }

    if (bySmartName.size >= maxItems) break;
  }

  return Array.from(bySmartName.values());
}

function formatSmartPropDate(rawDate) {
  if (!rawDate) return "";
  const d = new Date(rawDate);
  if (Number.isNaN(d.getTime())) return "";
  try {
    return d.toLocaleDateString("ro-RO", { day: "numeric", month: "short" });
  } catch (e) {
    return "";
  }
}

// 3. Randarea secțiunii „Workout-uri Propuse din Antrenamentele Tale” în TAB 3 (Workout)
function renderSmartProposedWorkoutsHTML() {
  const proposals = getSmartProposedWorkouts(8);
  const esc = typeof escapeHtml === "function" ? escapeHtml : (s) => String(s || "");
  const hasActiveExercises =
    typeof state !== "undefined" && Array.isArray(state.activeExercises) && state.activeExercises.length > 0;

  // Deschis implicit când antrenamentul e gol; restrâns discret când deja ridici în sală
  const openAttr = !hasActiveExercises ? "open" : "";

  const contentHTML = proposals.length
    ? `
      <div class="smart-prop-grid">
        ${proposals
          .map((prop) => {
            const dateText = formatSmartPropDate(prop.lastDateRaw);
            const exListHTML = prop.exercises
              .map((ex) => esc(ex.name))
              .join(`<span class="smart-prop-ex-sep">•</span>`);
            const encodedName = encodeURIComponent(prop.name);

            return `
              <div class="smart-prop-card">
                <div class="smart-prop-card-top">
                  <div class="smart-prop-title-wrap">
                    <h4 class="smart-prop-name">${esc(prop.name)}</h4>
                    <div class="smart-prop-meta-row">
                      <span class="smart-prop-count-badge">
                        <i data-lucide="dumbbell" style="width:11px;height:11px;stroke-width:2.1;"></i>
                        ${prop.exercises.length} ${prop.exercises.length === 1 ? "exercițiu" : "exerciții"}
                      </span>
                      ${
                        dateText
                          ? `<span class="smart-prop-date">
                               <i data-lucide="calendar" style="width:11px;height:11px;stroke-width:2;"></i>
                               Ultima: ${esc(dateText)}
                             </span>`
                          : ""
                      }
                    </div>
                  </div>
                  <button
                    type="button"
                    class="smart-prop-start-btn"
                    onclick="startSmartProposedWorkout('${encodedName}')"
                    title="Pornește ${esc(prop.name)}"
                  >
                    <i data-lucide="play" style="width:12px;height:12px;fill:currentColor;stroke-width:2;"></i>
                    <span>Începe</span>
                  </button>
                </div>
                <div class="smart-prop-ex-list" title="${esc(prop.exercises.map((e) => e.name).join(" • "))}">
                  ${exListHTML}
                </div>
              </div>
            `;
          })
          .join("")}
      </div>
    `
    : `
      <div class="smart-prop-empty">
        Finalizează primul antrenament și TITANLIFT îți va genera automat aici rutine personalizate (ex. <strong style="color:#F5F5F7;">Push Day</strong>, <strong style="color:#F5F5F7;">Chest &amp; Biceps Day</strong>) gata de pornit dintr-un singur click.
      </div>
    `;

  return `
    <details ${openAttr} class="smart-prop-section">
      <summary class="smart-prop-summary">
        <div class="smart-prop-summary-left">
          <div class="smart-prop-icon-wrap">
            <i data-lucide="sparkles" style="width:16px;height:16px;stroke-width:2;"></i>
          </div>
          <div style="min-width:0;">
            <div class="smart-prop-heading">
              Workout-uri Propuse din Antrenamentele Tale${proposals.length ? ` (${proposals.length})` : ""}
            </div>
            <div class="smart-prop-sub">
              Generate automat din istoricul tău • Cele mai recente variante unice
            </div>
          </div>
        </div>
        <i data-lucide="chevron-down" class="w-4 h-4 smart-prop-chevron"></i>
      </summary>
      ${contentHTML}
    </details>
  `;
}

// 4. Pornirea rapidă a unui workout propus (preîncărcat curat cu barele de Best Set & Țintă PR)
window.startSmartProposedWorkout = function (encodedSmartName) {
  if (typeof state === "undefined") return;
  const smartName = decodeURIComponent(String(encodedSmartName || ""));
  const proposals = getSmartProposedWorkouts(8);
  const proposal = proposals.find((p) => p.name === smartName);
  if (!proposal || !proposal.exercises.length) return;

  if (Array.isArray(state.activeExercises) && state.activeExercises.length > 0) {
    const ok = window.confirm(
      `Ai deja ${state.activeExercises.length} exerciții în antrenamentul activ. Vrei să le înlocuiești cu „${proposal.name}”?`
    );
    if (!ok) return;
  }

  // Detectăm cheia nativă a seriilor (weight vs kg, completed vs done) ca să rămână 100% compatibilă
  const sampleSet =
    (Array.isArray(state.workouts) &&
      state.workouts[0] &&
      Array.isArray(state.workouts[0].exercises) &&
      state.workouts[0].exercises[0] &&
      Array.isArray(state.workouts[0].exercises[0].sets) &&
      state.workouts[0].exercises[0].sets[0]) ||
    null;

  const usesKgKey = Boolean(sampleSet && "kg" in sampleSet && !("weight" in sampleSet));
  const nowBase = Date.now();

  state.activeExercises = proposal.exercises.map((exItem, idx) => {
    const sets = [];
    for (let s = 0; s < exItem.setsCount; s++) {
      const setObj = {
        id: `set-${nowBase}-${idx}-${s}`,
        reps: "",
        completed: false
      };
      if (usesKgKey) {
        setObj.kg = "";
      } else {
        setObj.weight = "";
      }
      sets.push(setObj);
    }

    return {
      id: `ae-${nowBase}-${idx}`,
      exerciseId: exItem.exerciseId,
      sets
    };
  });

  // Setăm numele sesiunii dacă există un câmp de nume în state
  if ("workoutName" in state) state.workoutName = proposal.name;
  if ("activeWorkoutName" in state) state.activeWorkoutName = proposal.name;
  if ("currentWorkoutName" in state) state.currentWorkoutName = proposal.name;
  state.activeTab = "tracker";

  if (typeof persistAllState === "function") persistAllState();
  if (typeof renderApp === "function") renderApp();

  if (typeof showToast === "function") {
    showToast(`Antrenament încărcat: ${proposal.name}`, "success");
  } else if (typeof window.showConsistencyToast === "function") {
    window.showConsistencyToast(`Antrenament încărcat: ${proposal.name}`, true);
  }
};

// 5. Auto-denumire inteligentă la salvarea oricărui antrenament (dacă nu are un nume custom)
function isGenericDefaultWorkoutName(rawName) {
  const norm = normalizeSmartText(rawName);
  if (!norm) return true;
  const genericList = [
    "antrenament",
    "antrenament forta",
    "antrenament de forta",
    "antrenament nou",
    "antrenament titanlift",
    "sesiune",
    "sesiune forta",
    "sesiune de forta",
    "sesiune antrenament",
    "sesiune de antrenament",
    "workout",
    "strength workout",
    "new workout",
    "titanlift workout",
    "custom workout"
  ];
  if (genericList.includes(norm)) return true;
  if (/^(antrenament|sesiune|workout)\s*[-•:#]?\s*(\d{1,2}[./-]\d{1,2}|#\d+)/.test(norm)) return true;
  return false;
}

(function hookSmartWorkoutAutoNaming() {
  if (typeof window.saveActiveWorkout !== "function" || window.saveActiveWorkout.__titanSmartNameWrapped) {
    return;
  }

  const origSave = window.saveActiveWorkout;
  const wrappedSave = function (...args) {
    const prevWorkouts =
      typeof state !== "undefined" && Array.isArray(state.workouts) ? state.workouts : [];
    const prevIds = new Set(prevWorkouts.map((w) => (w && w.id !== undefined ? String(w.id) : "")));
    const prevCount = prevWorkouts.length;

    const snapshotActive =
      typeof state !== "undefined" && Array.isArray(state.activeExercises)
        ? state.activeExercises.map((it) => ({
            ...it,
            sets: Array.isArray(it.sets) ? it.sets.map((s) => ({ ...s })) : []
          }))
        : [];

    const computedSmartName = generateSmartWorkoutName(snapshotActive);
    const result = origSave.apply(this, args);

    const applySmartNameIfNeeded = () => {
      if (typeof state === "undefined" || !Array.isArray(state.workouts)) return;
      if (state.workouts.length <= prevCount) return;

      // Găsim antrenamentul tocmai adăugat (indiferent dacă a fost inserat cu unshift la început sau push la final)
      let newest = state.workouts.find((w) => w && w.id !== undefined && !prevIds.has(String(w.id)));
      if (!newest) newest = state.workouts[0];
      if (!newest) return;

      const finalSmartName =
        computedSmartName && computedSmartName !== "Custom Workout"
          ? computedSmartName
          : generateSmartWorkoutName(newest.exercises);

      if (!finalSmartName || finalSmartName === "Custom Workout") return;

      let changed = false;
      if (isGenericDefaultWorkoutName(newest.name)) {
        newest.name = finalSmartName;
        changed = true;
      }
      if ("title" in newest && isGenericDefaultWorkoutName(newest.title)) {
        newest.title = finalSmartName;
        changed = true;
      }

      if (changed) {
        if (typeof persistAllState === "function") persistAllState();
        if (typeof renderApp === "function") renderApp();
      }
    };

    if (result && typeof result.then === "function") {
      result.then(() => applySmartNameIfNeeded());
    } else {
      applySmartNameIfNeeded();
    }

    return result;
  };

  wrappedSave.__titanSmartNameWrapped = true;
  window.saveActiveWorkout = wrappedSave;
})();

  </script>
